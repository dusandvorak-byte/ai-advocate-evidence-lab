name: Apply extracted-text call-site fix

on:
  push:
    branches: [fix/linear-pdf-byte-scanner-20261121]
    paths:
      - .github/workflows/apply-extracted-text-callsite-fix.yml

permissions:
  contents: write

jobs:
  patch:
    name: Patch the two pdftotext scanner calls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linear-pdf-byte-scanner-20261121
          fetch-depth: 0

      - name: Apply exact bounded replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/harden-public-pdf-privacy.py')
          text = path.read_text('utf-8')
          old = 'forbidden_public_identifier_byte_hits(text_bytes, matchers)'
          new = 'forbidden_public_identifier_byte_hits(text_bytes, matchers, scan_pdf_strings=False)'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 pdftotext call sites, found {count}')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
          python3 test/hardener_extracted_text_mode.test.py

      - name: Commit exact branch patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py
          git diff --cached --check
          git commit -m 'Disable PDF literal parsing for extracted text'
          git push origin HEAD:fix/linear-pdf-byte-scanner-20261121
