name: Repair final PDF fallback P2 findings

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]
    paths: [.github/repair-final-p2-20261121.py]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Install fixed PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1

      - name: Add focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair-final-p2-20261121.py tests
          python3 -m py_compile test/hardener_text_fallback.test.py
          git diff --check
          test "$(git diff --name-only)" = "test/hardener_text_fallback.test.py"

      - name: Prove both regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 test/hardener_text_fallback.test.py \
            HardenerTextFallbackTests.test_post_fallback_poppler_scan_failure_is_rejected \
            HardenerTextFallbackTests.test_durable_commit_failure_restores_original_target \
            > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q 'test_post_fallback_poppler_scan_failure_is_rejected' "$RUNNER_TEMP/red.log"
          grep -q 'test_durable_commit_failure_restores_original_target' "$RUNNER_TEMP/red.log"
          grep -Eq 'FAILED|FAIL:' "$RUNNER_TEMP/red.log"

      - name: Implement fail-closed post-scan and durable rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair-final-p2-20261121.py implementation
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          git diff --check

      - name: Run focused and broad privacy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 test/hardener_text_fallback.test.py
          python3 test/public_text_fallback.test.py
          python3 test/publication_redaction.test.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/harden-public-pdf-privacy.py test/hardener_text_fallback.test.py | sort)"
          test "$changed" = "$expected"

      - name: Commit verified P2 repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py test/hardener_text_fallback.test.py
          git diff --cached --quiet && exit 0
          git commit -m 'Close final fallback verification gaps'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
