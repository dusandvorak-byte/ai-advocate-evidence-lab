name: PDF runtime inventory synthetic tests
on:
  pull_request:
    paths:
      - 'ops/pdf-runtime/**'
      - '.github/workflows/pdf-runtime-inventory-tests.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Test inventory comparison with synthetic inputs only
        run: |
          python3 -m py_compile ops/pdf-runtime/inspect-runtime.py ops/pdf-runtime/test-inspect-runtime.py
          python3 ops/pdf-runtime/test-inspect-runtime.py -v
  real-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Install same PDF tools as trusted workflow
        run: |
          bash scripts/ensure-ci-pdf-tools.sh mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check --timeout 20 --retries 1 pymupdf==2.1 reportlab==5.1.0 pillow==13.0.0
      - name: Inspect real runner twice without publishing or using secrets
        run: |
          set -euo pipefail
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          time python3 ops/pdf-runtime/inspect-runtime.py --inventory-out "$RUNNER_TEMP/runtime-first.json"
          time python3 ops/pdf-runtime/inspect-runtime.py --inventory-out "$RUNNER_TEMP/runtime-second.json" --compare "$RUNNER_TEMP/runtime-first.json"
  container-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve immutable candidate base and test clean environment
        run: |
          set -euo pipefail
          docker build --no-cache -f ops/pdf-runtime/Dockerfile.candidate -t evidence-runtime-candidate:local ops/pdf-runtime
          docker run --rm --network none evidence-runtime-candidate:local cat requirements.sha256.txt
          docker run --rm --network none evidence-runtime-candidate:local sha256sum os-packages.tsv requirements.sha256.txt
          docker image inspect evidence-runtime-candidate:local --format '{{.Id}}'
          echo 'Diagnostic candidate only; production_authorization=false'
