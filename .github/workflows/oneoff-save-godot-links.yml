name: Jednorázově uložit opravené Godot PDF odkazy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-save:
    if: "!contains(github.event.head_commit.message, '[skip godot-save]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Spustit stávající kanonický build
        run: node scripts/build-site.mjs
      - name: Uložit pouze vygenerované opravy a odstranit jednorázové soubory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/oneoff-save-godot-links.yml .build-triggers/save-godot-links-2026-08-09.txt
          git add project-memory/documents-2026.json project-memory/pdf-reconciliation-report.json web/data/documents-2026.json web/data/godot-pdf-audit.json web/zpravy/04082026-010.html web/listiny
          git commit -m "Uložit opravené přímé PDF odkazy Godota [skip godot-save]"
          git push origin HEAD:main
