name: Apply parent-owned staged PDF transaction

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact staged-transaction patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATCHER'
          import subprocess
          import textwrap
          from pathlib import Path

          source_sha = "f8109ef6e4e1e39ad022b5f9c87894d5fb638651"
          source_path = ".github/workflows/apply-staged-candidate-transaction.yml"
          source = subprocess.check_output(
              ["git", "show", f"{source_sha}:{source_path}"],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patcher = textwrap.dedent(source[start:end])

          optional_marker = "old_worker_error ="
          optional_start = patcher.index(optional_marker)
          optional_start = patcher.rfind("\n", 0, optional_start) + 1
          next_marker = "start = text.index('def process_candidate_isolated(')"
          optional_end = patcher.index(next_marker, optional_start)
          optional_end = patcher.rfind("\n", 0, optional_end) + 1
          patcher = patcher[:optional_start] + patcher[optional_end:]
          if optional_marker in patcher:
              raise SystemExit("optional isolated-worker rewrite still present")

          cli_marker = "old_cli = '''"
          cli_start = patcher.index(cli_marker)
          cli_start = patcher.rfind("\n", 0, cli_start) + 1
          cli_end_marker = "text = text.replace(old_cli, new_cli)"
          cli_end = patcher.index(cli_end_marker, cli_start) + len(cli_end_marker)
          cli_end_line = patcher.find("\n", cli_end)
          if cli_end_line < 0:
              raise SystemExit("unterminated historical CLI rewrite block")
          patcher = patcher[:cli_start] + patcher[cli_end_line + 1:]
          if cli_marker in patcher or cli_end_marker in patcher:
              raise SystemExit("historical CLI rewrite block still present")

          scope = {}
          exec(compile(patcher, f"{source_sha}:{source_path}:embedded", "exec"), scope, scope)

          target = Path("scripts/harden-public-pdf-privacy.py")
          text = target.read_text("utf-8")
          old_cli = (
              '    elif len(sys.argv) >= 5 and sys.argv[1] == "--worker-candidate":\n'
              '        worker_candidate(sys.argv[2], sys.argv[3] == "1", json.loads(sys.argv[4]))\n'
          )
          new_cli = (
              '    elif len(sys.argv) >= 6 and sys.argv[1] == "--worker-candidate":\n'
              '        worker_candidate(\n'
              '            sys.argv[2],\n'
              '            sys.argv[3],\n'
              '            sys.argv[4] == "1",\n'
              '            json.loads(sys.argv[5]),\n'
              '        )\n'
          )
          if text.count(old_cli) != 1:
              raise SystemExit("unexpected current candidate CLI block")
          if new_cli in text:
              raise SystemExit("candidate CLI block was already rewritten")
          target.write_text(text.replace(old_cli, new_cli), "utf-8")
          PATCHER
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          git diff --check
          test "$(git diff --name-only)" = "scripts/harden-public-pdf-privacy.py"

      - name: Install fixed PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pymupdf==2.1

      - name: Verify staged transaction regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py
          git diff --cached --quiet && exit 0
          git commit -m 'Stage PDF candidates until parent verification succeeds'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
