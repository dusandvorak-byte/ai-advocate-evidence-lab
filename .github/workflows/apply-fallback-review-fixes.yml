name: Apply fallback review fixes

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]
    paths:
      - .github/workflows/apply-fallback-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    name: Apply transactional fallback hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-text-fallback-clean-20261121
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Apply exact reviewed patch
        run: python3 scripts/apply-fallback-review-fixes.py

      - name: Verify regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pymupdf==2.1
          python3 -m py_compile scripts/public_text_fallback.py
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py
          git diff --check

      - name: Commit bounded hardener fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py
          git diff --cached --check
          git commit -m 'Make fallback transactional and re-scan raw bytes'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
