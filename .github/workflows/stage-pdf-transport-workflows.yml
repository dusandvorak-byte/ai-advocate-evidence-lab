name: Stage PDF transport workflow dependencies

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]
    paths: [.github/stage-pdf-transport-workflows.trigger]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Stage exact dependency-only workflow copies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          staged = Path('.github/staged')
          staged.mkdir(parents=True, exist_ok=True)
          targets = [
              Path('.github/workflows/validate-evidence-lab-2.yml'),
              Path('.github/workflows/trusted-pdf-shard-diagnostic.yml'),
          ]
          old = 'sudo apt-get install -y -qq poppler-utils qpdf'
          new = 'sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf'
          for source in targets:
              text = source.read_text('utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'missing dependency anchor in {source}')
              output = staged / source.name
              output.write_text(text.replace(old, new), 'utf-8')
              if output.read_text('utf-8').count(new) < count:
                  raise SystemExit(f'incomplete dependency replacement in {source}')
          PY
          git diff --check
          test "$(git status --short --untracked-files=all | awk '{print $2}' | sort)" = "$(printf '%s\n' .github/staged/trusted-pdf-shard-diagnostic.yml .github/staged/validate-evidence-lab-2.yml | sort)"
      - name: Commit staged workflow blobs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/staged/trusted-pdf-shard-diagnostic.yml .github/staged/validate-evidence-lab-2.yml
          git commit -m 'Stage exact PDF transport workflow dependency blobs'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
