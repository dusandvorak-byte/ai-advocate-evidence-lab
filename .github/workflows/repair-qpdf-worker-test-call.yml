name: Repair qpdf staged-worker regression call

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Update staged-worker test call exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/publication_redaction.test.py')
          text = path.read_text('utf-8')
          old = '''        worker_globals["inspect_pdf_deep"] = forbidden_deep_inspection
        ns["worker_candidate"](
            "sample.pdf",
            True,
            {
                "page_count": 1,
                "reasons": ["revision_envelope"],
                "xmp_present": False,
            },
        )
'''
          new = '''        worker_globals["inspect_pdf_deep"] = forbidden_deep_inspection
        original_bytes = pdf.read_bytes()
        stage = self.tmpdir / ".sample.pdf.qpdf-post-test.candidate.pdf"
        stage.write_bytes(original_bytes)
        ns["worker_candidate"](
            "sample.pdf",
            stage.relative_to(self.tmpdir).as_posix(),
            True,
            {
                "page_count": 1,
                "reasons": ["revision_envelope"],
                "xmp_present": False,
                "source_sha256": hashlib.sha256(original_bytes).hexdigest(),
            },
        )
        self.assertEqual(pdf.read_bytes(), original_bytes)
'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected stale call-site count: {text.count(old)}')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
          python3 -m py_compile test/publication_redaction.test.py
          git diff --check
          test "$(git diff --name-only)" = "test/publication_redaction.test.py"

      - name: Install fixed PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pymupdf==2.1

      - name: Run affected and transaction regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 test/publication_redaction.test.py
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py

      - name: Commit verified test repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/publication_redaction.test.py
          git diff --cached --quiet && exit 0
          git commit -m 'Update qpdf worker regression for staged candidates'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
