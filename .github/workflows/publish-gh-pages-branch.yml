name: Publikovat ověřený Evidence Lab do gh-pages

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

env:
  NODE_VERSION: '24'
  EXPECTED_HEAD_SHA: ${{ github.sha }}

concurrency:
  group: evidence-lab-production
  cancel-in-progress: true

jobs:
  publish:
    name: Trusted release gate; publikace jen po exact-SHA autorizaci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Určit trusted preflight vs explicitně autorizovanou publikaci
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          auth_file=".release/evidence-lab-publication-authorization.json"
          mode="preflight"
          authorized_target=""

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed < <(git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA")
            if [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" = "$auth_file" ]; then
              python3 - "$auth_file" "$PREVIOUS_SHA" <<'PY'
          import json, re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          previous = sys.argv[2]
          data = json.loads(path.read_text("utf-8"))
          if data.get("schema_version") != 1:
              raise SystemExit("publication authorization schema mismatch")
          if data.get("authorization_scope") != "publish-evidence-lab-gh-pages":
              raise SystemExit("publication authorization scope mismatch")
          if data.get("authorized") is not True:
              raise SystemExit("authorization-only commit must set authorized=true")
          target = str(data.get("authorized_target_sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("authorized_target_sha must be exact 40hex")
          if target != previous:
              raise SystemExit("authorized_target_sha must equal the immediately preceding main SHA")
          print("Publication authorization file is structurally valid.")
          PY
              parent="$(git rev-parse "$GITHUB_SHA^")"
              test "$parent" = "$PREVIOUS_SHA"
              mode="publish"
              authorized_target="$PREVIOUS_SHA"
            fi
          fi

          echo "RELEASE_MODE=$mode" >> "$GITHUB_ENV"
          echo "AUTHORIZED_TARGET_SHA=$authorized_target" >> "$GITHUB_ENV"
          echo "Release mode: $mode"
          if [ "$mode" = "publish" ]; then
            echo "Authorized target SHA: $authorized_target"
          else
            echo "Trusted preflight only; gh-pages push is disabled."
          fi


      - name: Počkat na autoritativní exact-SHA shard audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5100))
          run_id=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            candidate="$(gh run list \
              --workflow trusted-pdf-shard-diagnostic.yml \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion,headSha,createdAt \
              --jq 'sort_by(.createdAt) | last // empty' || true)"
            if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
              status="$(jq -r '.status' <<<"$candidate")"
              run_id="$(jq -r '.databaseId' <<<"$candidate")"
              if [ "$status" = "completed" ]; then
                conclusion="$(jq -r '.conclusion' <<<"$candidate")"
                test "$conclusion" = "success" || {
                  echo "Exact-SHA shard audit $run_id ended with $conclusion" >&2
                  exit 1
                }
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "DIAGNOSTIC_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Authoritative shard audit succeeded: run $run_id"

      - name: Stáhnout a kryptograficky svázat auditovaný release tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/evidence-audit /tmp/verified-site
          mkdir -p /tmp/evidence-audit/tree /tmp/evidence-audit/report /tmp/verified-site
          gh run download "$DIAGNOSTIC_RUN_ID" \
            -n "trusted-public-tree-$GITHUB_SHA" \
            -D /tmp/evidence-audit/tree
          gh run download "$DIAGNOSTIC_RUN_ID" \
            -n "evidence-lab-pdf-shard-diagnostic-$GITHUB_SHA" \
            -D /tmp/evidence-audit/report

          report="$(find /tmp/evidence-audit/report -type f -name release-evidence-audit.json -print -quit)"
          test -n "$report"
          python3 - "$report" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          expected = sys.argv[2]
          if report.get("checkout_commit") != expected:
              raise SystemExit("audit checkout SHA mismatch")
          summary = report.get("summary") or {}
          if summary.get("hard_failure_count") != 0 or summary.get("hard_failures"):
              raise SystemExit("release audit contains hard failures")
          recon = report.get("registry_web_stage_reconciliation") or {}
          if recon.get("staged_set_exact_match") is not True:
              raise SystemExit("staged PDF set is not an exact registry match")
          if recon.get("id69_absent_from_final_release_state") is not True:
              raise SystemExit("withdrawn ID69 reappeared in release state")
          print("Exact-SHA release audit report accepted.")
          PY

          test -d /tmp/evidence-audit/tree/release-site
          cp -a /tmp/evidence-audit/tree/release-site/. /tmp/verified-site/
          test "$(cat /tmp/verified-site/.source-commit)" = "$GITHUB_SHA"
          test "$(cat /tmp/verified-site/web/.source-commit)" = "$GITHUB_SHA"

      - name: Potvrdit preflight-only režim bez publikace
        if: env.RELEASE_MODE != 'publish'
        run: |
          echo "Exact-SHA sharded preflight completed successfully."
          echo "No gh-pages write was attempted."
          echo "Publication still requires the protected authorization-only commit."

      - name: Publikovat ověřené soubory do jediné větve gh-pages
        if: env.RELEASE_MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          # The orphan checkout removes repository scripts. Pin the verifier outside the checkout.
          install -m 0600 scripts/verify-live-pdf.mjs /tmp/evidence-verify-live-pdf.mjs
          sha256sum scripts/verify-live-pdf.mjs | awk '{print $1}' > /tmp/evidence-verify-live-pdf.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-publish
          git rm -rf .
          git clean -fdx
          cp -a /tmp/verified-site/. .
          git add -A

          # Verify that git clean filters/attributes did not alter any audited byte.
          # The index must be an exact byte+mode+path representation of /tmp/verified-site.
          python3 - <<'PY'
          import os
          import stat
          import subprocess
          from pathlib import Path

          source = Path("/tmp/verified-site")
          expected = {}

          for path in source.rglob("*"):
              rel = path.relative_to(source).as_posix()
              st = path.lstat()
              if stat.S_ISREG(st.st_mode):
                  mode = "100755" if (st.st_mode & stat.S_IXUSR) else "100644"
                  expected[rel] = (mode, path.read_bytes())
              elif stat.S_ISLNK(st.st_mode):
                  expected[rel] = ("120000", os.readlink(path).encode())
              elif stat.S_ISDIR(st.st_mode):
                  continue
              else:
                  raise SystemExit(f"unsupported staged filesystem object: {rel}")

          proc = subprocess.run(
              ["git", "ls-files", "-s", "-z"],
              check=True, stdout=subprocess.PIPE
          )
          actual = {}
          for record in proc.stdout.split(b"\0"):
              if not record:
                  continue
              meta, raw_path = record.split(b"\t", 1)
              mode_b, blob_b, stage_b = meta.split()
              if stage_b != b"0":
                  raise SystemExit(f"non-zero git index stage for {raw_path!r}")
              rel = raw_path.decode("utf-8", "surrogateescape")
              blob = blob_b.decode("ascii")
              payload = subprocess.run(
                  ["git", "cat-file", "blob", blob],
                  check=True, stdout=subprocess.PIPE
              ).stdout
              actual[rel] = (mode_b.decode("ascii"), payload)

          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          if missing or extra:
              raise SystemExit(f"git index path-set mismatch: missing={missing} extra={extra}")

          changed = []
          for rel, exp in expected.items():
              got = actual[rel]
              if exp[0] != got[0] or exp[1] != got[1]:
                  changed.append(rel)
          if changed:
              raise SystemExit(f"git index differs from audited staging bytes/modes: {changed}")

          print(f"Git index identity verified for {len(expected)} audited staged files.")
          PY

          git commit -m "Publish verified Evidence Lab 2.0 from $GITHUB_SHA"
          git push --force origin HEAD:gh-pages

      - name: Ověřit živou produkci po publikaci
        if: env.RELEASE_MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          base="https://dusandvorak-byte.github.io/ai-advocate-evidence-lab"
          stamp="?v=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pages=(
            "index.html"
            "en.html"
            "kc/index.html"
            "kc/en.html"
            "zpravy/04082026-010.html"
            "news/04082026-010.html"
          )
          mapfile -t latest_ids < <(grep -o 'class="latest-record-card" data-document-id="[^"]*"' web/index.html | sed -E 's/.*data-document-id="([^"]+)"/\1/' | head -n 3)
          test "${#latest_ids[@]}" -eq 3
          shared_ids=(
            "doc-cs-dd-2026-10-01-spolecne-doplneni-nsz-vsz-uzavreny-retezec"
            "doc-cz-dd-2026-10-01-os-pro-bezplatna-obhajoba-15nt3104-3106"
            "doc-cz-dd-2026-10-01-uocr-pro-bono"
            "doc-cz-dd-2026-10-01-ms-pha-18-a-17-procesni-vyjadreni"
            "doc-cz-dd-2026-10-01-ms-pha-msp-18-a-23-uocr-dukaz"
            "doc-cz-ekk-2026-10-04-klicove-dukazy-obnovy"
            "doc-cz-ekk-2026-10-04-dukazni-chronologie-kjl-2008-2026"
            "doc-cz-gf-jk-2026-10-04-ks-ostrava-5-to-248-sumarizujici-sdeleni"
          )
          for page in "${pages[@]}"; do
            target="/tmp/live-$(echo "$page" | tr '/' '-')"
            for attempt in {1..12}; do
              if curl -fsSL --connect-timeout 10 --max-time 30 "$base/$page$stamp&live_try=$attempt" -o "$target"; then
                ok=1
                for required in "${shared_ids[@]}" "${latest_ids[@]}"; do
                  if ! grep -q "$required" "$target"; then
                    ok=0
                    break
                  fi
                done
                if [ "$ok" -eq 1 ] && ! grep -Eq 'data-timer-id=|id="procesni-casovace"|Živé procesní časovače|Live procedural timers' "$target"; then
                  break
                fi
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Živá produkce není synchronizovaná: $page" >&2
                echo "Očekávané dynamické nejnovější listiny: ${latest_ids[*]}" >&2
                for required in "${shared_ids[@]}" "${latest_ids[@]}"; do
                  grep -q "$required" "$target" || echo "Chybí: $required" >&2
                done
                exit 1
              fi
              sleep 5
            done
          done

          # První navigace a propojení webů musí být ověřeny až na živé produkci.
          grep -Eq 'data-nav-current-article href="zpravy/[0-9]{8}-[0-9]+\.html">Právě teď</a>' /tmp/live-index.html
          grep -q 'href="zpravy/index.html">Archiv zpráv</a>' /tmp/live-index.html
          grep -q 'href="#podpora">Podpořit</a>' /tmp/live-index.html
          ! grep -q 'href="#lhuty">Lhůty</a>' /tmp/live-index.html
          ! grep -q 'href="#semafor">Ověřit listinu</a>' /tmp/live-index.html
          grep -q '/ai-advocate-evidence-lab/kc/index.html' /tmp/live-index.html
          grep -q 'https://www.konopijelek.cz/' /tmp/live-index.html
          grep -q '/ai-advocate-evidence-lab/index.html' /tmp/live-kc-index.html
          grep -q 'https://www.konopijelek.cz/' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/kc/en.html' /tmp/live-en.html
          grep -q '/ai-advocate-evidence-lab/en.html' /tmp/live-kc-en.html
          grep -q '/ai-advocate-evidence-lab/zpravy/04082026-010.html#doc-cz-mk-2026-08-31-mk-53547-2026-socns' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/news/04082026-010.html#en-doc-cz-mk-2026-08-31-mk-53547-2026-socns' /tmp/live-kc-en.html
          grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-09/022-podani-2026-09-01.pdf' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-09/022-podani-2026-09-01.pdf' /tmp/live-kc-en.html
          # Aktuální redakční stav Justičního slalomu se ověřuje pouze uvnitř jeho komponentu.
          for attempt in {1..12}; do
            curl -fsSL --connect-timeout 10 --max-time 30 "$base/index.html$stamp&slalom_try=$attempt" -o /tmp/live-index.html
            python3 -c "from pathlib import Path; h=Path('/tmp/live-index.html').read_text(encoding='utf-8'); a=h.find('<!-- JUSTICE-SLALOM:BEGIN -->'); b=h.find('<!-- JUSTICE-SLALOM:END -->',a); assert a>=0 and b>=0; Path('/tmp/live-justice-slalom-panel.html').write_text(h[a:b],encoding='utf-8')"
            if ! grep -q 'doc-cz-ekk-2026-10-02-os-pro-procesni-dukazni-navrh' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-dd-2026-10-06-nsz-vsz-spolecne-dukazni-doplneni' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-ekk-dd-2026-10-08-kpr-nsz-msp-pp-mv-ospro-dukazni-doplneni' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/099-podani-2026-10-06-nsz-vsz.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/100-podani-2026-10-08-kpr-nsz-msp-ppr-mv-ospro.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-dd-2026-10-01-uocr-pro-bono--CZ-UOCR' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/089-podani-2026-10-02-original.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/092-podani-2026-10-02.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/093-podani-2026-10-04.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/094-priloha-dukazni-chronologie-2008-2026-original.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/095-podani-2026-10-04-klicove-dukazy.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/096-podani-2026-10-04-ks-ostrava.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/104-podani-2026-10-12-osz-os-prostejov-redigovany-original.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q 'Redigovaný originál PDF' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-ekk-2026-10-15-pcr-krpo-krpt-gibs-infz-tp' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-dd-2026-10-15-eu-ombudsman-202602199-first-supplement' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/105-podani-2026-10-15-police-thc-trestni-podnet-redigovany-original.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/106-podani-2026-10-15-ombudsman-202602199-redigovany-original.pdf' /tmp/live-justice-slalom-panel.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Živý Justiční slalom není po publikaci synchronizovaný." >&2
              exit 1
            fi
            sleep 5
          done
          ! grep -q '#procesni-casovace' /tmp/live-kc-index.html
          ! grep -q '#procesni-casovace' /tmp/live-kc-en.html
          ! grep -q '<span>MINISTERSTVO KULTURY</span><h3>MK 49467/2026 SOCNS</h3>' /tmp/live-kc-index.html
          ! grep -q '<span>MINISTRY OF CULTURE</span><h3>MK 49467/2026 SOCNS</h3>' /tmp/live-kc-en.html

          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$base/live-dockets.js$stamp" -o /tmp/live-dockets.js
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$base/live-dockets.css$stamp" -o /tmp/live-dockets.css
          # GitHub Pages může krátce po push ještě servírovat předchozí JSON.
          # Ověř skutečnou byte-identitu artefaktu před sémantickou živou kontrolou.
          expected_courts_sha="$(sha256sum web/data/active-court-dockets.json | cut -d' ' -f1)"
          courts_sha_ok=0
          for attempt in {1..12}; do
            rm -f /tmp/live-active-court-dockets.json
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base/data/active-court-dockets.json$stamp&court_try=$attempt" -o /tmp/live-active-court-dockets.json; then
              observed_courts_sha="$(sha256sum /tmp/live-active-court-dockets.json | cut -d' ' -f1)"
              if [ "$observed_courts_sha" = "$expected_courts_sha" ]; then
                courts_sha_ok=1
                break
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$courts_sha_ok" -ne 1 ]; then
            echo "Živý soudní registr není po publikaci shodný s buildem ani po 12 pokusech." >&2
            echo "Očekáváno SHA-256: $expected_courts_sha" >&2
            if [ -f /tmp/live-active-court-dockets.json ]; then
              echo "Zjištěno SHA-256: $(sha256sum /tmp/live-active-court-dockets.json | cut -d' ' -f1)" >&2
            fi
            exit 1
          fi
          test "$(jq -r '.rows | length' /tmp/live-active-court-dockets.json)" -ge 13
          test "$(jq -c '.table_contract.width_percent' /tmp/live-active-court-dockets.json)" = '[42,18,18,12,10]'
          # Chronologie NSZ je samostatný deterministický asset; živá SHA musí odpovídat buildu.
          expected_nsz_sha="$(sha256sum web/data/nsz-prelitigation-timeline.json | cut -d' ' -f1)"
          nsz_sha_ok=0
          for attempt in {1..12}; do
            rm -f /tmp/live-nsz-prelitigation-timeline.json
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base/data/nsz-prelitigation-timeline.json$stamp&nsz_try=$attempt" -o /tmp/live-nsz-prelitigation-timeline.json; then
              observed_nsz_sha="$(sha256sum /tmp/live-nsz-prelitigation-timeline.json | cut -d' ' -f1)"
              if [ "$observed_nsz_sha" = "$expected_nsz_sha" ]; then nsz_sha_ok=1; break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$nsz_sha_ok" -ne 1 ]; then
            echo "Živá chronologie NSZ neodpovídá buildu." >&2
            exit 1
          fi
          test "$(jq -r '.case_id' /tmp/live-nsz-prelitigation-timeline.json)" = 'CASE-CZ-NSZ-6NZN1737-2026'
          test "$(jq -r '.counts.incoming' /tmp/live-nsz-prelitigation-timeline.json)" -gt 0
          test "$(jq -r '.counts.outgoing' /tmp/live-nsz-prelitigation-timeline.json)" -gt 0
          # Živý dvojstranný rejstřík všech soudů/orgánů se ověřuje podle přesného SHA.
          expected_court_docs_sha="$(sha256sum web/data/court-publication-index.json | cut -d' ' -f1)"
          court_docs_sha_ok=0
          for attempt in {1..12}; do
            rm -f /tmp/live-court-publication-index.json
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base/data/court-publication-index.json$stamp&court_docs_try=$attempt" -o /tmp/live-court-publication-index.json; then
              observed_court_docs_sha="$(sha256sum /tmp/live-court-publication-index.json | cut -d' ' -f1)"
              if [ "$observed_court_docs_sha" = "$expected_court_docs_sha" ]; then court_docs_sha_ok=1; break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$court_docs_sha_ok" -ne 1 ]; then
            echo "Živé seznamy podání soudů a orgánů neodpovídají ověřenému buildu." >&2
            exit 1
          fi
          test "$(jq -r '.rows | length' /tmp/live-court-publication-index.json)" -ge 13
          test "$(jq -r '[.rows[] | select(.groups | length != 2)] | length' /tmp/live-court-publication-index.json)" = '0'
          grep -q 'active-case-publications-toggle' /tmp/live-dockets.js
          grep -q 'active-nsz-timeline' /tmp/live-dockets.js
          grep -q 'court-nsz-prelitigation-6nzn1737' /tmp/live-active-court-dockets.json
          grep -q 'https://www.konopijelek.cz/nejvyssi-statni-zastupitelstvi-on-line/' /tmp/live-active-court-dockets.json
          # Ověřit po nasazení věcné deep-linky a rozlišení rozhodnutých žalob od připravované nové žaloby.
          python - <<'PY'
          import json
          with open('/tmp/live-active-court-dockets.json',encoding='utf-8') as source:
              registry=json.load(source)
          rows={row['id']:row for row in registry['rows']}
          targets={
              'court-media-ct':'https://www.konopijelek.cz/ceska-televize/',
              'court-media-ftv-prima':'https://www.konopijelek.cz/novinky/cnn-prima-news/',
              'court-ms-praha-18a17':'https://www.konopijelek.cz/policie/',
              'court-ms-praha-18a23':'https://www.konopijelek.cz/ministerstvo-spravedlnosti/',
              'court-ms-praha-15a44-nss6as207':'https://www.konopijelek.cz/ministerstvo-vnitra/',
