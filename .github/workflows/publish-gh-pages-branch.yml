          grep -q 'en-doc-cz-mv-2026-10-07-mv-134798-4-so-2026' /tmp/live-current-article-en.html
          grep -q 'documents/report-04082026-010/115-mv-134798-4-so-2026-2026-10-07.pdf' /tmp/live-current-article.html
          python3 - <<'PY'
          from pathlib import Path
          cs=Path('/tmp/live-current-article.html').read_text(encoding='utf-8')
          en=Path('/tmp/live-current-article-en.html').read_text(encoding='utf-8')
          def table(html, marker):
              s=html.find(marker)
              assert s>=0, marker
              e=html.find('</table>',s)
              assert e>=0
              return html[s:e+8]
          cst=table(cs,'<table id="chronologie-seznam"')
          ent=table(en,'<table id="en-chronology-list"')
          assert 'data-submission-side="outgoing_from_user_or_alliance"' not in cst
          assert 'data-submission-side="outgoing_from_user_or_alliance"' not in ent
          for x in ['Na co orgán reaguje','Námitka / opravný prostředek']:
              assert x in cst, x
          for x in ['What the authority responded to','Objection / remedy']:
              assert x in ent, x
          assert 'justice-slalom-shell state-love-shell' in cs
          assert 'home-rollup justice-slalom state-love-panel' in cs
          for own in [
              'doc-cz-ekk-2026-10-06-cnb-rb-aml-podnet',
              'doc-cz-dd-2026-10-06-ms-praha-18a17-18a23-dukazni-doplneni',
