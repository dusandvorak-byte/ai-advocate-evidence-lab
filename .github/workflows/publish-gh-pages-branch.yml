name: Publikovat ověřený Evidence Lab do gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24'

concurrency:
  group: evidence-lab-production
  cancel-in-progress: true

jobs:
  publish:
    name: Sestavit, ověřit a publikovat jedinou produkční verzi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Použít Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Materializovat ověřené binární PDF zdroje
        run: node scripts/materialize-binary-sources.mjs
      - name: Spustit jediný kanonický build
        run: node scripts/build-site.mjs
      - name: Finalizovat veřejné popisky bez změny kanonických dat
        run: node scripts/finalize-public-labels.mjs
      - name: Vynutit závaznou značku titulní strany
        run: node scripts/enforce-homepage-brand.mjs
      - name: Vynutit společnou šířkovou osu všech veřejných ploch
        run: node scripts/enforce-shared-shell.mjs
      - name: Ověřit věcné publikační invarianty
        run: node scripts/validate-publication-invariants.mjs
      - name: Ověřit Evidence Lab 2.0 před publikací
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/zpravy/04082026-010.html
          test -f web/data/build-manifest.json
          test -f web/data/pdf-reconciliation-report.json
          test -f web/data/operations-state.json
          test -f web/data/registry-audit.json
          grep -q 'Pavouk řízení od 1. května 2026, aneb Kdy přijde Godot?' web/zpravy/04082026-010.html
          ! grep -q 'Pavouk český křižák z Branibor' web/zpravy/04082026-010.html
          ! grep -q 'href="web/' web/zpravy/04082026-010.html
          grep -q 'Reportér důkazů kartelu, korupce a zločinů státu ve věci konopí' web/index.html
          grep -q 'href="shell-axis.css"' web/index.html
          grep -q 'href="shell-axis.css"' web/en.html
          grep -q 'href="shell-axis.css"' web/kc/index.html
          grep -q 'href="shell-axis.css"' web/kc/en.html
          grep -q '"schema_version": "2.2"' web/data/build-manifest.json
          grep -q '"registry_hard_errors": 0' web/data/build-manifest.json
          grep -q 'Otevřít originální listinu v PDF' web/listiny/nsz-6-nzn-1737-2026-15.html
          test -f web/documents/report-04082026-010/25-mv-127234-2-obp-2026-2026-08-11.pdf
          test -f web/documents/report-04082026-010/26-gfaa-rozklad-mv-127234-2-obp-2026-2026-08-12.pdf
          test -f web/documents/report-04082026-010/27-mk-49467-2026-socns-2026-08-12.pdf
          test -f web/documents/report-04082026-010/28-dvorak-odvolani-nsz-sin-55-2026-19-2026-08-01.pdf
          test -f web/documents/report-04082026-010/29-dvorak-odvolani-msz-sin-48-2026-12-2026-07-31.pdf
          test -f web/documents/report-04082026-010/30-dvorak-stiznost-msz-necinnost-infz-2026-07-31.pdf
          for f in web/documents/report-04082026-010/{25-mv-127234-2-obp-2026-2026-08-11,26-gfaa-rozklad-mv-127234-2-obp-2026-2026-08-12,27-mk-49467-2026-socns-2026-08-12,28-dvorak-odvolani-nsz-sin-55-2026-19-2026-08-01,29-dvorak-odvolani-msz-sin-48-2026-12-2026-07-31,30-dvorak-stiznost-msz-necinnost-infz-2026-07-31}.pdf; do
            test "$(head -c 5 "$f")" = '%PDF-'
          done
      - name: Připravit kořen webu a kompatibilní cestu /web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verified-site /tmp/verified-site-copy
          mkdir -p /tmp/verified-site /tmp/verified-site-copy
          cp -a web/. /tmp/verified-site/
          cp -a web/. /tmp/verified-site-copy/
          mkdir -p /tmp/verified-site/web
          cp -a /tmp/verified-site-copy/. /tmp/verified-site/web/
          touch /tmp/verified-site/.nojekyll
          touch /tmp/verified-site/web/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > /tmp/verified-site/.source-commit
          printf '%s\n' "$GITHUB_SHA" > /tmp/verified-site/web/.source-commit
      - name: Publikovat ověřené soubory do jediné větve gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-publish
          git rm -rf .
          cp -a /tmp/verified-site/. .
          git add -A
          git commit -m "Publish verified Evidence Lab 2.0 from $GITHUB_SHA"
          git push --force origin HEAD:gh-pages
      - name: Souhrn
        run: |
          echo "Evidence Lab 2.0 byl publikován pouze po věcné i technické validaci."
          echo "Kořenové URL i kompatibilní /web/ URL jsou součástí stejného ověřeného buildu."
