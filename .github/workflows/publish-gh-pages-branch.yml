              'doc-cz-dd-2026-10-06-nsz-vsz-spolecne-dukazni-doplneni',
              'doc-cz-ekk-dd-2026-10-08-kpr-nsz-msp-pp-mv-ospro-dukazni-doplneni',
          ]:
              assert f'<tr id="{own}"' not in cst, own
          assert '<tr id="doc-eu-omb-2026-09-28-complaint-form-required"' in cst
          assert 'data-related-document-id="doc-cz-citc-2026-10-06-eu-ombudsman-euda-form-59936"' in cst
          for incoming in [
              'doc-eu-omb-2026-10-07-202602199-registration',
              'doc-cz-ms-pha-2026-10-06-15-ad-14-2026-13',
              'doc-cz-ms-pha-2026-10-07-15-ad-14-2026-17',
          ]:
              assert f'<tr id="{incoming}"' in cst, incoming
              assert f'<tr id="en-{incoming}"' in ent, incoming
          print('LIVE_STATE_LOVE_OK')
          PY
          grep -q 'en-doc-cz-ks-brn-2026-09-03-9-to-315-2026-140' /tmp/live-current-article-en.html
          grep -q 'en-doc-cz-ms-pha-2026-10-02-18-a-17-2026-191' /tmp/live-current-article-en.html
          echo "00db06c75bb6451328a92f66e4b9c0ad810d92dab59f5a049e4231fd841c940c  /tmp/live-ms186.pdf" | sha256sum -c -
          echo "612e7ac3a5e7b26f6f6c6586552cbd7a09e82256ca8e64e064d9bbe0d05d4869  /tmp/live-ncoz.pdf" | sha256sum -c -
          test "$(sha256sum /tmp/live-euda-1001.pdf | cut -d' ' -f1)" = "$(sha256sum web/documents/report-04082026-010/109-euda-comparability-thc-access-documents-2026-10-01-verejna-kopie.pdf | cut -d' ' -f1)"
          echo "c9cd624bff387428a670ef28351796b8bd4e89f53a7c019add281d6b395696ce  /tmp/live-ksz.pdf" | sha256sum -c -
          echo "Živá produkce ověřena: orgány jsou hlavní řádky Godota; vlastní podání 6. a 8. 10. jsou v Justičním slalomu a v Godotu pouze vztahově; všech 5 nových PDF je byte-identických s originály."

