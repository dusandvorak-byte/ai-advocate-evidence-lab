name: Publikovat ověřený Evidence Lab do gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24'

concurrency:
  group: evidence-lab-production
  cancel-in-progress: true

jobs:
  publish:
    name: Sestavit, ověřit a publikovat jedinou produkční verzi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Použít Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ověřit syntaxi kritických WEB validátorů
        run: |
          node --check scripts/validate-live-dockets-contract.mjs
          node --check scripts/validate-process-chain-contract.mjs

      - name: Připravit Python pro ověřenou veřejnou kopii ÚOOÚ
        run: python3 -m pip install --quiet reportlab

      - name: Obnovit přesné PDF z historických binárních zdrojů
        run: node scripts/recover-historical-binary-blobs.mjs

      - name: Materializovat a hashově ověřit verzované PDF Godota
        run: node scripts/materialize-godot-pdf-bundle.mjs

      - name: Materializovat a hashově ověřit nové státní PDF 20.–24. 8. 2026
        run: node scripts/materialize-godot-state-bundle-2026-08-24.mjs

      - name: Materializovat PDF ÚOOÚ z 26. 8. 2026
        run: python3 scripts/materialize-uoou-2026-08-26.py

      - name: Materializovat ověřenou veřejnou kopii odpovědi EUDA z 25. 9. 2026
        run: python3 scripts/materialize-euda-2026-09-25.py

      - name: Připravit anglickou překladovou vrstvu
        run: node scripts/prepare-md-english-build.mjs

      - name: Spustit jediný kanonický build
        run: node scripts/build-site.mjs

      - name: Odstranit historické duplicity bloků procesních časovačů
        run: node scripts/cleanup-godot-duplicate-timers.mjs

      - name: Doplnit opačné vazby stát na naše předchozí podání
        run: node scripts/patch-godot-reverse-reactions.mjs

      - name: Finalizovat veřejné popisky bez změny kanonických dat
        run: node scripts/finalize-public-labels.mjs

      - name: Finalizovat anglické plochy Ministerstva dopravy
        run: node scripts/finalize-md-english-surfaces.mjs

      - name: Nahradit veřejné časovače chronologickým archivem Justiční slalom
        run: node scripts/build-justice-slalom.mjs

      - name: Znovu ověřit PDF po všech finálních úpravách
        run: node scripts/audit-godot-pdf-links.mjs

      - name: Obnovit společnou jazykovou nabídku po všech generátorech
        run: node scripts/build-language-access.mjs

      - name: Ověřit archiv podání, příjemce, PDF a nepřítomnost časovačů
        run: node scripts/validate-justice-slalom.mjs

      - name: Ověřit nové státní listiny a uzavření přezkumu KSZ
        run: node scripts/validate-state-release-2026-09-29.mjs

      - name: Ověřit odpověď EUDA z 1. října a její procesní vazbu
        run: node scripts/validate-euda-access-documents-2026-10-01.mjs

      - name: Ověřit procesní odpověď Evropského ombudsmana z 28. září
        run: node scripts/validate-eu-ombudsman-2026-09-28.mjs

      - name: Ověřit aktuální rozkladovou fázi Konopné církve a propojení webů
        run: node scripts/validate-church-current-state.mjs

      - name: Ověřit EKK balík z 2. října včetně obou PDF
        run: node scripts/validate-ekk-evidence-2026-10-02.mjs

      - name: Ověřit čtyři nově doložené soudní listiny a jejich PDF
        run: node scripts/validate-four-records-2026-10-03.mjs

      - name: Ověřit podání a důkazní chronologii ze 4. října
        run: node scripts/validate-october-4-submissions.mjs

      - name: Ověřit podnět ČNB a společné podání MS Praha ze 6. října
        run: node scripts/validate-october-6-submissions.mjs

      - name: Ověřit rozdělení Godot / Justiční slalom pro listiny 6.–8. října
        run: node scripts/validate-godot-filings-2026-10-08.mjs

      - name: Ověřit dvě institucionální odpovědi z 1. a 7. října
        run: node scripts/validate-state-responses-2026-10-07.mjs

      - name: Ověřit rozhodnutí ministra vnitra o rozkladu ze 7. října
        run: node scripts/validate-mv-rozklad-2026-10-07.mjs

      - name: Ověřit tři lišty, barvy a chronologii soudních řízení
        run: node scripts/validate-live-dockets-contract.mjs

      - name: Ověřit Evidence Lab 2.0 před publikací
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/zpravy/04082026-010.html
          test -f web/data/build-manifest.json
          test -f web/data/pdf-reconciliation-report.json
          test -f web/data/operations-state.json
          test -f web/data/registry-audit.json
          test -f web/data/godot-pdf-audit.json

          grep -q 'Godot online – rozhodnutí státních a veřejných institucí od 1. května 2026. Přijde Státu lásky čas?' web/zpravy/04082026-010.html
          ! grep -q 'Pavouk český křižák z Branibor' web/zpravy/04082026-010.html
          ! grep -q 'href="web/' web/zpravy/04082026-010.html
          grep -q 'Godot online – rozhodnutí státních a veřejných institucí od 1. května 2026. Přijde Státu lásky čas?' web/live-dockets.js
          grep -q 'Aktivní soudní řízení od 1. května 2026' web/live-dockets.js
          grep -q 'justicni-slalom' web/live-dockets.js
          ! grep -q 'Předžalobní řízení on-line od 1. května 2026' web/live-dockets.js
          ! grep -q 'Státní láska online od 1. května 2026' web/live-dockets.js
          grep -q '<script src="live-dockets.js" defer></script>' web/index.html
          grep -q 'state-love-table' web/zpravy/04082026-010.html
          grep -q '>Dne</th>' web/zpravy/04082026-010.html
          ! grep -q 'state-love-panel" open' web/zpravy/04082026-010.html
          grep -q 'justice-slalom-shell state-love-shell' web/index.html
          grep -q 'home-rollup justice-slalom state-love-panel' web/index.html
          grep -q 'doc-cz-citc-2026-10-06-eu-ombudsman-euda-form-59936' web/zpravy/04082026-010.html
          grep -q 'grid-auto-columns:minmax(0,1fr)' web/layout-fix.css
          grep -q 'grid-template-columns:260px minmax(0,1fr)' web/live-dockets.css
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' web/live-dockets.css

          grep -q '"schema_version": "2.2"' web/data/build-manifest.json
          grep -q '"build_entrypoint": "scripts/build-site.mjs"' web/data/build-manifest.json
          grep -q '"registry_hard_errors": 0' web/data/build-manifest.json
          grep -q '"single_public_build_entrypoint": true' web/data/build-manifest.json
          grep -q '"two_derived_submission_counters": true' web/data/build-manifest.json
          grep -q '"five_alliance_privacy_exemptions": true' web/data/build-manifest.json

          state_count="$(jq -r '.counts.state_public_submissions' web/data/build-manifest.json)"
          verified_pdf_count="$(jq -r '.linked_pdf_count' web/data/pdf-reconciliation-report.json)"
          test "$state_count" -ge 1
          test "$verified_pdf_count" -ge 1
          grep -q "Stát: ${state_count} evidovaných listin" web/zpravy/04082026-010.html
          grep -q "${state_count} reakcí státní lásky od 1. května 2026 · nejnovější nahoře · nejstarší reakce má číslo 1. Přijde už konečně Godot?" web/index.html
          grep -q "${state_count} state and public-institution records" web/en.html
          grep -q "${state_count} state and public-institution records" web/kc/en.html
          grep -q "${verified_pdf_count} verified public PDFs" web/en.html
          grep -q "${verified_pdf_count} verified public PDFs" web/kc/en.html

          grep -q '"required_without_active_pdf_count": 0' web/data/godot-pdf-audit.json
          grep -q '"reaction_without_active_pdf_count": 0' web/data/godot-pdf-audit.json
          grep -q '"broken_article_pdf_link_count": 0' web/data/godot-pdf-audit.json
          grep -q '"invalid_registry_pdf_link_count": 0' web/data/godot-pdf-audit.json
          grep -q '"missing_rendered_reaction_count": 0' web/data/godot-pdf-audit.json
          grep -q '"missing_reaction_pdf_link_count": 0' web/data/godot-pdf-audit.json

          grep -q '>Dokument v PDF<' web/listiny/nsz-6-nzn-1737-2026-15.html
          grep -q '>Dokument v PDF<' web/zpravy/04082026-010.html
          grep -q '>Dokument v PDF<' web/listiny/doc-cz-kpr-2026-07-30-kpr-5772-2026-1.html
          grep -q '>Dokument v PDF<' web/listiny/doc-cz-kpr-2026-08-03-kpr-5080-2026.html
          ! grep -Eqi '>Otevřít (originální listinu v PDF|ověřenou veřejnou kopii PDF)<' web/zpravy/04082026-010.html web/listiny/*.html

          test -f web/documents/report-04082026-010/01-nsz-6-nzn-1737-2026-15-2026-05-06.pdf
          test "$(head -c 5 web/documents/report-04082026-010/01-nsz-6-nzn-1737-2026-15-2026-05-06.pdf)" = '%PDF-'
          test -f web/documents/report-04082026-010/77-uoou-05841-26-3-2026-08-26.pdf
          test "$(head -c 5 web/documents/report-04082026-010/77-uoou-05841-26-3-2026-08-26.pdf)" = '%PDF-'
          grep -q 'UOOU-05841/26-3' web/zpravy/04082026-010.html
          grep -q '1. 9. 2026' web/zpravy/04082026-010.html
          test "$(grep -o '<h3>Předžalobní a předprocesní výzvy' web/zpravy/04082026-010.html | wc -l)" -le 1
          test "$(grep -o '<h3>Správní a informační řízení' web/zpravy/04082026-010.html | wc -l)" -le 1
          test "$(grep -o '<h3>Přezkumy a dohledy' web/zpravy/04082026-010.html | wc -l)" -le 1

          cat > /tmp/godot-pdf-sha256.txt <<'EOF'
          c65c9cc5f12eab03f69c4ea1bf642c3078f4858153b385e80f141da6ea334a55  web/documents/report-04082026-010/25-mv-127234-2-obp-2026-2026-08-11.pdf
          769392aa996dda284c927b9bee9fbee1c364daade8d2a1867fe7fa380d4b3cc2  web/documents/report-04082026-010/26-gfaa-rozklad-mv-127234-2-obp-2026-2026-08-12.pdf
          bb23820c9a02a17a976f0a746def4c53f4afa413fb708259e25a59d6a2f0f3b1  web/documents/report-04082026-010/27-mk-49467-2026-socns-2026-08-12.pdf
          021a9c83a3079ab0b6e26205c510e6d8b1633dfe3c30c57c3048538942fb91b3  web/documents/report-04082026-010/28-dvorak-odvolani-nsz-sin-55-2026-19-2026-08-01.pdf
          564fa5536735679523d976664eb805fa82987c7699134a15f483c530b4a40e02  web/documents/report-04082026-010/29-dvorak-odvolani-msz-sin-48-2026-12-2026-07-31.pdf
          77e623a6b0af714d479ec8b8c4fda8ea3fef0d2330f0dc6fcf541258c73e9dec  web/documents/report-04082026-010/30-dvorak-stiznost-msz-necinnost-infz-2026-07-31.pdf
          823d7ec58d9ed6de4abde4f0636eb1d87d9d16c331ac7d143c2342621999c88c  web/documents/report-04082026-010/31-policie-uvk-pp-ppr-43826-2-cj-2026-990210-pd-2026-08-14.pdf
          f74b439f6d99826a7f49b32e08e2f908017c4e840a2b8837dd241fbc582f765d  web/documents/report-04082026-010/32-dvorak-stiznost-uvk-pp-pcr-2026-08-14.pdf
          d461ad6eacc569ba8d86c4ce640a3f6273ff67ae48fc5ea57f1f8653ce0e2a40  web/documents/report-04082026-010/33-os-prostejov-15-nt-3103-2026-53-2026-08-07.pdf
          33086830279d85789e32590b0e725ce969ae222694e8f4d936b49b9cec7850dd  web/documents/report-04082026-010/34-mzdr-13429-2026-3-olzp-2026-05-29.pdf
          c43c816b79295749c5da876050d540689ce8c80c85939ab4f0dc3478b5c7a6af  web/documents/report-04082026-010/35-rrtv-7757-2026-fej-2026-07-16.pdf
          7743a0d0cf03b00423cf85a2baf619ccd0dbb467c953afdffe8cb1bef4548b4f  web/documents/report-04082026-010/36-ncoz-4324-2-cj-2026-4100pi-2026-05-22.pdf
          EOF
          sed -i 's/^          //' /tmp/godot-pdf-sha256.txt
          sha256sum -c /tmp/godot-pdf-sha256.txt
          grep -q 'NCOZ-4324-2/ČJ-2026-4100PI' web/en.html
          grep -q 'Ministry of Transport' web/en.html
          grep -q 'The Ministry of Transport deferred the information request' web/en.html
          grep -q 'Ministry of Transport' web/news/04082026-010.html
          grep -q 'The Ministry of Transport deferred the freedom-of-information request' web/news/04082026-010.html

      - name: Připravit kořen webu a kompatibilní cestu /web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verified-site /tmp/verified-site-copy
          mkdir -p /tmp/verified-site /tmp/verified-site-copy
          cp -a web/. /tmp/verified-site/
          cp -a web/. /tmp/verified-site-copy/
          mkdir -p /tmp/verified-site/web
          cp -a /tmp/verified-site-copy/. /tmp/verified-site/web/
          version="${GITHUB_SHA:0:12}"
          while IFS= read -r -d '' html_file; do
            sed -E -i "s#src=\"live-dockets\\.js(\\?v=[^\"]*)?\"#src=\"live-dockets.js?v=${version}\"#g" "$html_file"
            sed -E -i "s#src=\"news-feed\\.js(\\?v=[^\"]*)?\"#src=\"news-feed.js?v=${version}\"#g" "$html_file"
            sed -E -i "s#href=\"/ai-advocate-evidence-lab/justice-slalom\\.css(\\?v=[^\"]*)?\"#href=\"/ai-advocate-evidence-lab/justice-slalom.css?v=${version}\"#g" "$html_file"
          done < <(find /tmp/verified-site -type f -name '*.html' -print0)
          sed -E -i "s#const cssHref = 'home-rollups\\.css(\\?v=[^']*)?'#const cssHref = 'home-rollups.css?v=${version}'#g" /tmp/verified-site/live-dockets.js /tmp/verified-site/web/live-dockets.js
          grep -q "live-dockets.js?v=${version}" /tmp/verified-site/index.html
          grep -q "live-dockets.js?v=${version}" /tmp/verified-site/en.html
          grep -q "news-feed.js?v=${version}" /tmp/verified-site/en.html
          grep -q "home-rollups.css?v=${version}" /tmp/verified-site/live-dockets.js
          touch /tmp/verified-site/.nojekyll
          touch /tmp/verified-site/web/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > /tmp/verified-site/.source-commit
          printf '%s\n' "$GITHUB_SHA" > /tmp/verified-site/web/.source-commit

      - name: Publikovat ověřené soubory do jediné větve gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-publish
          git rm -rf .
          cp -a /tmp/verified-site/. .
          git add -A
          git commit -m "Publish verified Evidence Lab 2.0 from $GITHUB_SHA"
          git push --force origin HEAD:gh-pages

      - name: Ověřit živou produkci po publikaci
        shell: bash
        run: |
          set -euo pipefail
          base="https://dusandvorak-byte.github.io/ai-advocate-evidence-lab"
          stamp="?v=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pages=(
            "index.html"
            "en.html"
            "kc/index.html"
            "kc/en.html"
            "zpravy/04082026-010.html"
            "news/04082026-010.html"
          )
          mapfile -t latest_ids < <(grep -o 'class="latest-record-card" data-document-id="[^"]*"' web/index.html | sed -E 's/.*data-document-id="([^"]+)"/\1/' | head -n 3)
          test "${#latest_ids[@]}" -eq 3
          shared_ids=(
            "doc-cs-dd-2026-10-01-spolecne-doplneni-nsz-vsz-uzavreny-retezec"
            "doc-cz-dd-2026-10-01-os-pro-bezplatna-obhajoba-15nt3104-3106"
            "doc-cz-dd-2026-10-01-uocr-pro-bono"
            "doc-cz-dd-2026-10-01-ms-pha-18-a-17-procesni-vyjadreni"
            "doc-cz-dd-2026-10-01-ms-pha-msp-18-a-23-uocr-dukaz"
            "doc-cz-ekk-2026-10-04-klicove-dukazy-obnovy"
            "doc-cz-ekk-2026-10-04-dukazni-chronologie-kjl-2008-2026"
            "doc-cz-gf-jk-2026-10-04-ks-ostrava-5-to-248-sumarizujici-sdeleni"
          )
          for page in "${pages[@]}"; do
            target="/tmp/live-$(echo "$page" | tr '/' '-')"
            for attempt in {1..12}; do
              if curl -fsSL --connect-timeout 10 --max-time 30 "$base/$page$stamp&live_try=$attempt" -o "$target"; then
                ok=1
                for required in "${shared_ids[@]}" "${latest_ids[@]}"; do
                  if ! grep -q "$required" "$target"; then
                    ok=0
                    break
                  fi
                done
                if [ "$ok" -eq 1 ] && ! grep -Eq 'data-timer-id=|id="procesni-casovace"|Živé procesní časovače|Live procedural timers' "$target"; then
                  break
                fi
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Živá produkce není synchronizovaná: $page" >&2
                echo "Očekávané dynamické nejnovější listiny: ${latest_ids[*]}" >&2
                for required in "${shared_ids[@]}" "${latest_ids[@]}"; do
                  grep -q "$required" "$target" || echo "Chybí: $required" >&2
                done
                exit 1
              fi
              sleep 5
            done
          done

          # První navigace a propojení webů musí být ověřeny až na živé produkci.
          grep -Eq 'data-nav-current-article href="zpravy/[0-9]{8}-[0-9]+\.html">Právě teď</a>' /tmp/live-index.html
          grep -q 'href="zpravy/index.html">Archiv zpráv</a>' /tmp/live-index.html
          grep -q 'href="#podpora">Podpořit</a>' /tmp/live-index.html
          ! grep -q 'href="#lhuty">Lhůty</a>' /tmp/live-index.html
          ! grep -q 'href="#semafor">Ověřit listinu</a>' /tmp/live-index.html
          grep -q '/ai-advocate-evidence-lab/kc/index.html' /tmp/live-index.html
          grep -q 'https://www.konopijelek.cz/' /tmp/live-index.html
          grep -q '/ai-advocate-evidence-lab/index.html' /tmp/live-kc-index.html
          grep -q 'https://www.konopijelek.cz/' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/kc/en.html' /tmp/live-en.html
          grep -q '/ai-advocate-evidence-lab/en.html' /tmp/live-kc-en.html
          grep -q '/ai-advocate-evidence-lab/zpravy/04082026-010.html#doc-cz-mk-2026-08-31-mk-53547-2026-socns' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/news/04082026-010.html#en-doc-cz-mk-2026-08-31-mk-53547-2026-socns' /tmp/live-kc-en.html
          grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-09/022-podani-2026-09-01.pdf' /tmp/live-kc-index.html
          grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-09/022-podani-2026-09-01.pdf' /tmp/live-kc-en.html
          # Aktuální redakční stav Justičního slalomu se ověřuje pouze uvnitř jeho komponentu.
          for attempt in {1..12}; do
            curl -fsSL --connect-timeout 10 --max-time 30 "$base/index.html$stamp&slalom_try=$attempt" -o /tmp/live-index.html
            python3 -c "from pathlib import Path; h=Path('/tmp/live-index.html').read_text(encoding='utf-8'); a=h.find('<!-- JUSTICE-SLALOM:BEGIN -->'); b=h.find('<!-- JUSTICE-SLALOM:END -->',a); assert a>=0 and b>=0; Path('/tmp/live-justice-slalom-panel.html').write_text(h[a:b],encoding='utf-8')"
            if ! grep -q 'doc-cz-ekk-2026-10-02-os-pro-procesni-dukazni-navrh' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-dd-2026-10-06-nsz-vsz-spolecne-dukazni-doplneni' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-ekk-dd-2026-10-08-kpr-nsz-msp-pp-mv-ospro-dukazni-doplneni' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/099-podani-2026-10-06-nsz-vsz.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/100-podani-2026-10-08-kpr-nsz-msp-ppr-mv-ospro.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q 'doc-cz-dd-2026-10-01-uocr-pro-bono--CZ-UOCR' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/089-podani-2026-10-02-original.pdf' /tmp/live-justice-slalom-panel.html \
              && grep -q '/ai-advocate-evidence-lab/documents/justice-slalom/2026-10/092-podani-2026-10-02.pdf' /tmp/live-justice-slalom-panel.html \
