name: Ověřit Evidence Lab 2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'

concurrency:
  group: evidence-lab-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_static:
    name: PR kontrola bez přístupu k private Secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Načíst přesný PR HEAD bez Secrets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Použít Python 3.12 pro reprodukovatelné PDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Použít Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Staticky ověřit privacy a release guardy
        run: |
          node --check scripts/diagnose-four-records-provenance.mjs
          node --check scripts/validate-release-exclusions.mjs
          node --check scripts/state-release-pdf-provenance.mjs
          node --check scripts/validate-state-release-2026-09-29.mjs
          node --check scripts/ekk-public-text-provenance.mjs
          node --check scripts/validate-ekk-evidence-2026-10-02.mjs
          node --test test/state-release-pdf-provenance.test.mjs
          python3 test/audit_git_lineage.test.py -v
          python3 test/workflow_git_lineage_binding.test.py -v
          python3 -m py_compile scripts/audit-release-evidence-sliced.py scripts/audit_git_lineage.py
          node --check scripts/ensure-generated-state-pdfs.mjs
          node --check scripts/validate-justice-slalom.mjs
          node --test test/justice-slalom-pdf-provenance.test.mjs
          node --test test/release-cache-version.test.mjs
          node --test test/plan-incremental-release.test.mjs
          node --test test/reconciliation-reference-index.test.mjs
          python3 test/release-audit-poll.test.py
          bash -n scripts/validate-final-web-contracts.sh
          python3 test/final-web-negative-guard.test.py
          node --test test/late-original-public-provenance.test.mjs
          python3 test/test_live_release_sha.py -v
          python3 -m py_compile scripts/publication_redaction.py
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          python3 -m py_compile scripts/generated_pdf_signatures.py
          python3 -m py_compile scripts/audit-release-evidence-2026-11-13.py
          python3 -m py_compile scripts/provenance_hardening_bridge.py

      - name: Collect non-authoritative SHA candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          python3 scripts/collect-canonical-pdf-sha-candidates.py

      - name: Upload canonical SHA candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pdf-sha-candidates
          path: review-artifacts/canonical-pdf-sha-candidates.json
          if-no-files-found: error
          retention-days: 7

      - name: Evaluate SHA candidate provenance without exposing PDF text
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 20 --retries 1 pymupdf==2.1
          python3 scripts/evaluate-canonical-pdf-provenance.py

      - name: Upload canonical SHA provenance evaluation
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pdf-provenance-evaluation
          path: review-artifacts/canonical-pdf-provenance-evaluation.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify deterministic public-copy materialization and record hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --timeout 20 --retries 1 reportlab==5.1.0
          rm -rf "$RUNNER_TEMP/evidence-lab-deterministic-rebuild"
          mkdir -p "$RUNNER_TEMP/evidence-lab-deterministic-rebuild"
          EVIDENCE_LAB_VERIFIED_COPY_OUT="$RUNNER_TEMP/evidence-lab-deterministic-rebuild" \
            python3 scripts/materialize-verified-public-copies-2026-09-16.py
          export EVIDENCE_LAB_DETERMINISTIC_REBUILD_ROOT="$RUNNER_TEMP/evidence-lab-deterministic-rebuild"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["EVIDENCE_LAB_DETERMINISTIC_REBUILD_ROOT"])
          names=[
            "89-ms-praha-8-ad-9-2026-89-2026-09-09.pdf",
            "92-ms-praha-9-ad-12-2026-7-2026-09-14.pdf",
            "93-mv-139593-3-tp-2026-2026-09-14.pdf",
            "94-vsz-olomouc-3-vzn-239-2026-64-2026-09-15.pdf",
            "97-ms-praha-15-ad-14-2026-12-2026-09-22-verejna-kopie.pdf",
            "98-ms-praha-18-a-23-2026-182-2026-09-23-verejna-kopie.pdf",
            "99-ms-praha-18-a-17-2026-182-2026-09-23-verejna-kopie.pdf",
            "100-msp-19-2026-odka-roz-26-2026-08-27-verejna-kopie.pdf",
          ]
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          first={name:digest(root/name) for name in names}
          Path("review-artifacts").mkdir(exist_ok=True)
          Path("review-artifacts/generated-public-copy-hashes-first.json").write_text(json.dumps(first,indent=2)+"\n")
          PY
          python3 scripts/materialize-verified-public-copies-2026-09-16.py
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["EVIDENCE_LAB_DETERMINISTIC_REBUILD_ROOT"])
          first=json.loads(Path("review-artifacts/generated-public-copy-hashes-first.json").read_text())
          second={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in first}
          if first != second:
              raise SystemExit(f"verified public-copy generator is not deterministic: {[(k,first[k],second[k]) for k in first if first[k]!=second[k]]}")
          out={
            "schema_version":"1.0",
            "generator":"scripts/materialize-verified-public-copies-2026-09-16.py",
            "deterministic_rebuild_match":True,
            "hashes":second,
          }
          Path("review-artifacts/generated-public-copy-hashes.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY

      - name: Upload deterministic generated public-copy hashes
        uses: actions/upload-artifact@v4
        with:
          name: generated-public-copy-hashes
          path: review-artifacts/generated-public-copy-hashes.json
          if-no-files-found: error
          retention-days: 7

      - name: Run fail-closed provenance hardening bridge regressions
        run: |
          python3 test/provenance_hardening_bridge.test.py

      - name: Reverify remediated canonical PDF provenance from primary evidence
        run: |
          python3 scripts/validate-canonical-pdf-sha-provenance.py

      - name: Spustit pouze syntetické privacy regrese bez repository Secrets
        run: |
          bash scripts/ensure-ci-pdf-tools.sh qpdf
          python3 test/publication_redaction.test.py

      - name: Fail closed on canonical PDF records without SHA-256 provenance
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          registry = json.loads(Path("project-memory/documents-2026.json").read_text("utf-8"))
          missing = []
          for item in registry.get("documents", []):
              public = item.get("public") or {}
              if not public.get("pdf"):
                  continue
              sha = str(public.get("sha256") or "")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", sha):
                  missing.append({"id": item.get("id"), "pdf": public.get("pdf")})
          if missing:
              print(json.dumps({"canonical_pdf_sha_missing_count": len(missing), "items": missing}, ensure_ascii=False))
              raise SystemExit("canonical PDF SHA provenance incomplete")
          print("Canonical PDF SHA provenance complete.")
          PY

  validate:
    name: Trusted build se secret-backed privacy policy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Načíst přesný PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Použít Python 3.12 pro reprodukovatelné PDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Použít Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Určit trusted preflight vs explicitně autorizovanou publikaci
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          auth_file=".release/evidence-lab-publication-authorization.json"
          mode="preflight"
          authorized_target=""
          audit_target="$GITHUB_SHA"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed < <(git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA")
            if [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" = "$auth_file" ]; then
              python3 - "$auth_file" "$PREVIOUS_SHA" <<'PY'
          import json, re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          previous = sys.argv[2]
          data = json.loads(path.read_text("utf-8"))
          if data.get("schema_version") != 1:
              raise SystemExit("publication authorization schema mismatch")
          if data.get("authorization_scope") != "publish-evidence-lab-gh-pages":
              raise SystemExit("publication authorization scope mismatch")
          if data.get("authorized") is not True:
              raise SystemExit("authorization-only commit must set authorized=true")
          target = str(data.get("authorized_target_sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("authorized_target_sha must be exact 40hex")
          if target != previous:
              raise SystemExit("authorized_target_sha must equal the immediately preceding main SHA")
          print("Publication authorization file is structurally valid.")
          PY
              parent="$(git rev-parse "$GITHUB_SHA^")"
              test "$parent" = "$PREVIOUS_SHA"
              mode="publish"
              authorized_target="$PREVIOUS_SHA"
              audit_target="$PREVIOUS_SHA"
            fi
          fi

          echo "RELEASE_MODE=$mode" >> "$GITHUB_ENV"
          echo "AUTHORIZED_TARGET_SHA=$authorized_target" >> "$GITHUB_ENV"
          echo "AUDIT_TARGET_SHA=$audit_target" >> "$GITHUB_ENV"
          echo "Release mode: $mode"
          echo "Authoritative audit target SHA: $audit_target"
          if [ "$mode" = "publish" ]; then
            echo "Authorized target SHA: $authorized_target"
          else
            echo "Trusted preflight only; gh-pages push is disabled."
          fi


      - name: Počkat na autoritativní exact-SHA shard audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5100))
          run_id=""
          successful_run_id=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            candidate="$(gh run list \
              --workflow trusted-pdf-shard-diagnostic.yml \
              --commit "$AUDIT_TARGET_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion,headSha,createdAt \
              --jq 'sort_by(.createdAt) | last // empty' || true)"
            if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
              status="$(jq -r '.status' <<<"$candidate")"
              run_id="$(jq -r '.databaseId' <<<"$candidate")"
              candidate_sha="$(jq -r '.headSha' <<<"$candidate")"
              if [[ ! "$run_id" =~ ^[0-9]+$ ]] || [ "$candidate_sha" != "$AUDIT_TARGET_SHA" ]; then
                echo "Unexpected audit run identity; refusing publication." >&2
                exit 1
              fi
              if [ "$status" = "completed" ]; then
                conclusion="$(jq -r '.conclusion' <<<"$candidate")"
                test "$conclusion" = "success" || {
                  echo "Exact-SHA shard audit $run_id ended with $conclusion" >&2
                  exit 1
                }
                successful_run_id="$run_id"
                break
              fi
            fi
            sleep 10
          done
          if [ -z "$successful_run_id" ]; then
            echo "Timed out without a successful exact-SHA shard audit; refusing publication." >&2
            exit 1
          fi
          echo "DIAGNOSTIC_RUN_ID=$successful_run_id" >> "$GITHUB_ENV"
          echo "Authoritative shard audit succeeded: run $successful_run_id"

      - name: Stáhnout a kryptograficky svázat auditovaný release tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/evidence-audit /tmp/verified-site
          mkdir -p /tmp/evidence-audit/tree /tmp/evidence-audit/report /tmp/verified-site
          gh run download "$DIAGNOSTIC_RUN_ID" \
            -n "trusted-public-tree-$AUDIT_TARGET_SHA" \
            -D /tmp/evidence-audit/tree
          gh run download "$DIAGNOSTIC_RUN_ID" \
            -n "evidence-lab-pdf-shard-diagnostic-$AUDIT_TARGET_SHA" \
            -D /tmp/evidence-audit/report

          report="$(find /tmp/evidence-audit/report -type f -name release-evidence-audit.json -print -quit)"
          test -n "$report"
          python3 - "$report" "$AUDIT_TARGET_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          expected = sys.argv[2]
          if report.get("checkout_commit") != expected:
              raise SystemExit("audit checkout SHA mismatch")
          summary = report.get("summary") or {}
          if summary.get("hard_failure_count") != 0 or summary.get("hard_failures"):
              raise SystemExit("release audit contains hard failures")
          recon = report.get("registry_web_stage_reconciliation") or {}
          if recon.get("staged_set_exact_match") is not True:
              raise SystemExit("staged PDF set is not an exact registry match")
          if recon.get("id69_absent_from_final_release_state") is not True:
              raise SystemExit("withdrawn ID69 reappeared in release state")
          print("Exact-SHA release audit report accepted.")
          PY

          test -d /tmp/evidence-audit/tree/release-site
          cp -a /tmp/evidence-audit/tree/release-site/. /tmp/verified-site/
          test "$(cat /tmp/verified-site/.source-commit)" = "$AUDIT_TARGET_SHA"
          test "$(cat /tmp/verified-site/web/.source-commit)" = "$AUDIT_TARGET_SHA"
          test -f /tmp/verified-site/.nojekyll
          test -f /tmp/verified-site/web/.nojekyll
          python3 scripts/validate-staged-legacy-pdf-provenance.py "$report" /tmp/verified-site
          node scripts/release-cache-version.mjs --verify /tmp/verified-site "$AUDIT_TARGET_SHA"

      - name: Uložit release evidence audit pro lidské review
        uses: actions/upload-artifact@v4
        with:
          name: evidence-lab-release-evidence-${{ runner.os }}
          path: /tmp/evidence-audit/report/release-evidence-audit.json
          if-no-files-found: error

      - name: Uložit ověřený web pouze jako kontrolní artefakt
        uses: actions/upload-artifact@v4
        with:
          name: evidence-lab-2-kontrolni-web-${{ runner.os }}
          path: /tmp/evidence-audit/tree/web
          if-no-files-found: error
