name: Ověřit Evidence Lab 2.0

on:
  push:
    branches: [agent/evidence-lab-2-final]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub-hosted runner pro validační failover'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-24.04
          - macos-14
          - windows-2025

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate:
    name: Ověřit architekturu a sestavit web bez publikace
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Načíst zvolenou větev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Použít Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Připravit generátor ověřených veřejných PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check reportlab

      - name: Obnovit a kryptograficky ověřit všechna verzovaná PDF z historie
        run: node scripts/recover-historical-binary-blobs.mjs

      - name: Materializovat a hashově ověřit verzované PDF Godota
        run: node scripts/materialize-godot-pdf-bundle.mjs

      - name: Vytvořit ověřené veřejné PDF nových státních listin 20.–24. 8. 2026
        run: node scripts/materialize-godot-state-bundle-2026-08-24.mjs

      - name: Materializovat ověřené veřejné PDF nových listin 26.–28. 8. 2026
        run: python3 scripts/materialize-uoou-2026-08-26.py

      - name: Připravit anglickou překladovou vrstvu
        run: node scripts/prepare-md-english-build.mjs

      - name: Spustit jediný kanonický build
        run: node scripts/build-site.mjs

      - name: Doplnit opačné vazby stát na naše předchozí podání
        run: node scripts/patch-godot-reverse-reactions.mjs

      - name: Finalizovat veřejné popisky bez změny kanonických dat
        run: node scripts/finalize-public-labels.mjs

      - name: Finalizovat anglické plochy Ministerstva dopravy
        run: node scripts/finalize-md-english-surfaces.mjs

      - name: Ověřit PDF odkazy Godota
        run: node scripts/audit-godot-pdf-links.mjs

      - name: Ověřit tři lišty, barvy a chronologii soudních řízení
        run: node scripts/validate-live-dockets-contract.mjs

      - name: Ověřit manifest Evidence Lab 2.0 bez ručních počtů
        shell: bash
        run: |
          set -euo pipefail
          test -f web/data/build-manifest.json
          grep -q '"schema_version": "2.2"' web/data/build-manifest.json
          grep -q '"build_entrypoint": "scripts/build-site.mjs"' web/data/build-manifest.json
          grep -q '"single_clock_system": true' web/data/build-manifest.json
          grep -q '"two_derived_submission_counters": true' web/data/build-manifest.json
          grep -q '"single_public_build_entrypoint": true' web/data/build-manifest.json
          grep -q '"five_alliance_privacy_exemptions": true' web/data/build-manifest.json
          grep -q '"lawful_third_person_anonymization": true' web/data/build-manifest.json
          grep -q '"privacy_alliance_organizations_count": 5' web/data/build-manifest.json
          grep -q '"internal_knowledge_not_auto_published": true' web/data/build-manifest.json
          test -f web/data/operations-state.json
          test -f web/data/registry-audit.json
          test -f web/data/godot-pdf-audit.json
          test -f web/data/generated-state-pdf-manifest.json
          test -f web/zpravy/04082026-010.html
          test "$(jq -r '.count' web/data/generated-state-pdf-manifest.json)" = '8'
          state_count="$(jq -r '.counts.state_public_submissions' web/data/build-manifest.json)"
          test "$state_count" -ge 82
          grep -q "Stát: ${state_count} evidovaných listin" web/zpravy/04082026-010.html
          grep -q "data-english-chronology-count=\"${state_count}\"" web/news/04082026-010.html
          grep -q '8 Ad 9/2026-85' web/zpravy/04082026-010.html
          grep -q '8 Ad 9/2026-85' web/news/04082026-010.html
          grep -q '82-ms-praha-8-ad-9-2026-85-2026-08-28.pdf' web/zpravy/04082026-010.html
          grep -q '"required_without_active_pdf_count": 0' web/data/godot-pdf-audit.json
          grep -q '"reaction_without_active_pdf_count": 0' web/data/godot-pdf-audit.json
          grep -q 'Ministry of Transport' web/news/04082026-010.html
          grep -q '2 KZN 55/2025-136' web/zpravy/04082026-010.html
          grep -q 'KU-4139-12/ČJ-2026-2305KM' web/zpravy/04082026-010.html
          grep -q 'KRPT-203594-8/ČJ-2026-0700KR' web/zpravy/04082026-010.html
          grep -q 'PPR-44020-2/ČJ-2026-990210-PD' web/zpravy/04082026-010.html
          for f in web/documents/report-04082026-010/{64-msz-praha-2-kzn-55-2025-136-2026-08-20,65-ku-4139-12-cj-2026-2305km-2026-08-20,66-krpt-203594-7-cj-2026-0700kr-2026-08-20,67-krpt-priloha-rr-ku-54-2021,68-krpt-priloha-rr-ku-54-2021-priloha-1,69-krpt-priloha-metodicko-odborne-vyjezdy-okte-2009-2019,70-krpt-203594-8-cj-2026-0700kr-2026-08-20,71-ppr-44020-2-cj-2026-990210-pd-2026-08-24}.pdf; do
            test -f "$f"
            test "$(head -c 5 "$f")" = '%PDF-'
          done
          test -f web/documents/report-04082026-010/82-ms-praha-8-ad-9-2026-85-2026-08-28.pdf
          test "$(head -c 5 web/documents/report-04082026-010/82-ms-praha-8-ad-9-2026-85-2026-08-28.pdf)" = '%PDF-'
          ! grep -qi 'AI Advocate for the Poor — final English project submission' web/zpravy/04082026-010.html
          ! grep -qi 'Výroční zpráva 2025 aliance Cannabis is The Cure' web/zpravy/04082026-010.html

      - name: Uložit ověřený web pouze jako kontrolní artefakt
        uses: actions/upload-artifact@v4
        with:
          name: evidence-lab-2-kontrolni-web-${{ runner.os }}
          path: web
