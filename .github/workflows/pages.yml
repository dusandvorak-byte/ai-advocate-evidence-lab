name: Deploy Evidence Lab – PDF Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate evidence site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconcile registries and build complete site
        run: node scripts/build-site.mjs

      - name: Verify canonical outputs and homepage bars
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/zpravy/04082026-010.html
          test -f web/data/build-manifest.json
          test -f web/data/pdf-reconciliation-report.json
          grep -q 'Aktivní soudní řízení on-line od 1. května 2026' web/index.html
          grep -q 'Předžalobní řízení on-line od 1. května 2026' web/index.html
          grep -q 'Státní láska online od 1. května 2026' web/index.html
          grep -q 'Pavouk řízení od 1. května 2026, aneb Kdy přijde Godot?' web/zpravy/04082026-010.html
          ! grep -q 'Pavouk český křižák z Branibor' web/zpravy/04082026-010.html
          grep -q 'id="chronologie-seznam"' web/zpravy/04082026-010.html
          ! grep -qi 'aktivní originály' web/zpravy/04082026-010.html
          ! grep -q 'href="web/' web/zpravy/04082026-010.html
          grep -q '"schema_version": "2.1"' web/data/build-manifest.json

      - name: Verify every registered local PDF and generated evidence page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const registry = JSON.parse(fs.readFileSync('project-memory/documents-2026.json', 'utf8'));
          const failures = [];
          let linked = 0;
          for (const doc of registry.documents || []) {
            const pdf = doc.public && doc.public.pdf;
            if (!pdf || /^https?:\/\//i.test(pdf)) continue;
            const publicPath = String(pdf).replace(/^\.\//, '').replace(/^\/+/, '').replace(/^web\//, '');
            const repoPath = path.join('web', publicPath);
            if (!fs.existsSync(repoPath)) {
              failures.push(`${doc.id}: chybí ${repoPath}`);
              continue;
            }
            const signature = fs.readFileSync(repoPath).subarray(0, 5).toString();
            if (signature !== '%PDF-') failures.push(`${doc.id}: neplatný PDF podpis`);
            const evidencePath = path.join('web', 'listiny', `${doc.id}.html`);
            const specialPath = doc.id === 'doc-cz-nsz-2026-05-06-6-nzn-1737-2026-15'
              ? path.join('web', 'listiny', 'nsz-6-nzn-1737-2026-15.html')
              : evidencePath;
            const page = fs.existsSync(specialPath) ? specialPath : evidencePath;
            if (!fs.existsSync(page)) failures.push(`${doc.id}: chybí evidenční stránka`);
            else if (!fs.readFileSync(page, 'utf8').includes(publicPath)) failures.push(`${doc.id}: evidenční stránka neodkazuje na PDF`);
            linked += 1;
          }
          console.log(`Ověřeno ${linked} aktivních lokálních PDF vazeb.`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Deploy verified artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 10000

  verify-live:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify homepage, article and NSZ PDF
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://dusandvorak-byte.github.io/ai-advocate-evidence-lab'
          for attempt in $(seq 1 20); do
            q="?verify=${GITHUB_SHA}-${attempt}"
            if curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/$q" -o /tmp/home.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/zpravy/04082026-010.html$q" -o /tmp/article.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 --range 0-4 "$BASE/documents/report-04082026-010/01-nsz-6-nzn-1737-2026-15-2026-05-06.pdf$q" -o /tmp/nsz.pdf \
              && grep -q 'Aktivní soudní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Předžalobní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Státní láska online od 1. května 2026' /tmp/home.html \
              && grep -q 'Pavouk řízení od 1. května 2026, aneb Kdy přijde Godot?' /tmp/article.html \
              && ! grep -q 'Pavouk český křižák z Branibor' /tmp/article.html \
              && test "$(head -c 5 /tmp/nsz.pdf)" = '%PDF-'; then
              echo 'Živý web i kontrolní PDF jsou ověřeny.'
              exit 0
            fi
            sleep 15
          done
          echo 'Živý web se v ověřovacím okně neaktualizoval.' >&2
          exit 1
