name: Deploy Evidence Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static chronology and public evidence pages
        run: node scripts/build-dynamic-chronology.mjs

      - name: Ensure truthful MSZ Praha document link
        run: node scripts/ensure-msz-3-kzn-197-link.mjs

      - name: Insert three static homepage bars
        run: node scripts/finalize-homepage.mjs

      - name: Finalize public labels and verify required layout
        run: node scripts/finalize-public-labels.mjs

      - name: Build deadlines and inactivity status
        run: node scripts/build-deadlines.mjs

      - name: Verify public chronology and homepage before deploy
        run: |
          test -f web/index.html
          test -f web/live-dockets.js
          test -f web/live-dockets.css
          test -f web/zpravy/04082026-010.html
          grep -q 'Chronologický seznam dokumentů sbírky Godot on-line od 1. května 2026.' web/index.html
          grep -q 'Aktivní soudní řízení on-line od 1. května 2026' web/index.html
          grep -q 'Předžalobní řízení on-line od 1. května 2026' web/index.html
          grep -q 'Státní láska online od 1. května 2026' web/index.html
          ! grep -q 'do 3. srpna 2026' web/index.html
          ! grep -q '2026. května' web/index.html
          grep -q 'id="chronologie-seznam"' web/zpravy/04082026-010.html
          grep -q 'Pavouk český křižák z Branibor již více než 15 let splétá síť na trase Praha–Brno–Praha a zpět. Kdo tu síť rozmotá?' web/zpravy/04082026-010.html
          ! grep -q 'Načítám chronologii dokumentů' web/zpravy/04082026-010.html
          ! grep -qi 'aktivní originály' web/zpravy/04082026-010.html
          test "$(grep -o '<li id="doc-[^"]*"' web/zpravy/04082026-010.html | wc -l)" -ge 55
          test "$(grep -o '<a href="[^"]*"' web/zpravy/04082026-010.html | wc -l)" -ge 55

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          if [ -z "$BASE" ]; then
            BASE="https://dusandvorak-byte.github.io/ai-advocate-evidence-lab"
          fi
          HOME_URL="$BASE/?verify=$GITHUB_SHA"
          ARTICLE_URL="$BASE/zpravy/04082026-010.html?verify=$GITHUB_SHA"
          verified=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 15 --max-time 30 "$HOME_URL" -o /tmp/home.html \
              && curl -fsSL --connect-timeout 15 --max-time 30 "$ARTICLE_URL" -o /tmp/article.html \
              && grep -q 'Chronologický seznam dokumentů sbírky Godot on-line od 1. května 2026.' /tmp/home.html \
              && grep -q 'Aktivní soudní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Předžalobní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Státní láska online od 1. května 2026' /tmp/home.html \
              && ! grep -q 'do 3. srpna 2026' /tmp/home.html \
              && ! grep -q '2026. května' /tmp/home.html \
              && grep -q 'id="chronologie-seznam"' /tmp/article.html \
              && grep -q 'Pavouk český křižák z Branibor již více než 15 let splétá síť na trase Praha–Brno–Praha a zpět. Kdo tu síť rozmotá?' /tmp/article.html \
              && ! grep -q 'Načítám chronologii dokumentů' /tmp/article.html \
              && ! grep -qi 'aktivní originály' /tmp/article.html \
              && test "$(grep -o '<li id="doc-[^"]*"' /tmp/article.html | wc -l)" -ge 55 \
              && test "$(grep -o '<a href="[^"]*"' /tmp/article.html | wc -l)" -ge 55; then
              verified=1
              break
            fi
            sleep 10
          done
          test "$verified" -eq 1

      - name: Record verified deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > project-memory/pages-deploy-verified.json <<EOF
          {
            "status": "verified",
            "deployed_sha": "$GITHUB_SHA",
            "checked_at": "$checked_at",
            "page_url": "$PAGE_URL",
            "homepage_bars_verified": true,
            "spider_title_verified": true,
            "dynamic_chronology_verified": true,
            "separate_active_originals_block_absent": true,
            "chronology_links_verified": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-memory/pages-deploy-verified.json
          git commit -m "Record verified Pages deploy [skip ci]"
          git push
