name: Deploy Evidence Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dynamic document chronology
        run: node scripts/build-dynamic-chronology.mjs

      - name: Test evidence boundaries and public UI
        id: tests
        continue-on-error: true
        run: node --test test/*.test.mjs

      - name: Report non-blocking test result
        if: steps.tests.outcome == 'failure'
        run: echo "Regression tests reported a failure; deployment continues so the public evidence site remains available."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
