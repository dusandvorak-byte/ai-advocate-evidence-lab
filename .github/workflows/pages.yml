name: Deploy Evidence Lab

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate the complete public site
        run: node scripts/build-site.mjs

      - name: Verify canonical build manifest
        run: |
          set -euo pipefail
          test -f web/data/build-manifest.json
          grep -q '"build_entrypoint": "scripts/build-site.mjs"' web/data/build-manifest.json
          grep -q '"documents": "project-memory/documents-2026.json"' web/data/build-manifest.json
          grep -q '"axioms": "project-memory/publication-axioms.json"' web/data/build-manifest.json
          grep -q '"local_and_external_https_document_ingest": true' web/data/build-manifest.json
          grep -q '"relevance_with_explanation_and_human_review": true' web/data/build-manifest.json
          grep -q '"deadline_and_inactivity_tracking": true' web/data/build-manifest.json
          grep -q '"interactive_document_case_law_statute_memory": true' web/data/build-manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment, chronology and every published PDF link
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          if [ -z "$BASE" ]; then
            BASE="https://dusandvorak-byte.github.io/ai-advocate-evidence-lab"
          fi
          HOME_URL="$BASE/?verify=$GITHUB_SHA"
          ARTICLE_URL="$BASE/zpravy/04082026-010.html?verify=$GITHUB_SHA"
          MANIFEST_URL="$BASE/data/build-manifest.json?verify=$GITHUB_SHA"
          verified=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 15 --max-time 30 "$HOME_URL" -o /tmp/home.html \
              && curl -fsSL --connect-timeout 15 --max-time 30 "$ARTICLE_URL" -o /tmp/article.html \
              && curl -fsSL --connect-timeout 15 --max-time 30 "$MANIFEST_URL" -o /tmp/build-manifest.json \
              && grep -q 'Aktivní soudní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Předžalobní řízení on-line od 1. května 2026' /tmp/home.html \
              && grep -q 'Státní láska online od 1. května 2026' /tmp/home.html \
              && grep -q 'Pavouk řízení od 1. května 2026, aneb Kdy přijde Godot?' /tmp/article.html \
              && ! grep -q 'Pavouk český křižák z Branibor' /tmp/article.html \
              && grep -q 'id="chronologie-seznam"' /tmp/article.html \
              && ! grep -qi 'aktivní originály' /tmp/article.html \
              && ! grep -q 'href="web/' /tmp/article.html \
              && grep -q '"schema_version": "2.0"' /tmp/build-manifest.json \
              && grep -q '"build_entrypoint": "scripts/build-site.mjs"' /tmp/build-manifest.json; then
              verified=1
              break
            fi
            sleep 10
          done
          test "$verified" -eq 1

          grep -o 'href="[^"]*\.pdf"' /tmp/article.html | sed 's/^href="//;s/"$//' | sort -u > /tmp/pdf-links.txt
          while IFS= read -r href; do
            [ -z "$href" ] && continue
            case "$href" in
              http://*|https://*) url="$href" ;;
              /*) url="${BASE}${href}" ;;
              *) url="${BASE}/${href}" ;;
            esac
            curl -fsSL --connect-timeout 15 --max-time 45 "$url" -o /tmp/verified.pdf
            test "$(head -c 5 /tmp/verified.pdf)" = '%PDF-'
          done < /tmp/pdf-links.txt

      - name: Record verified deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > project-memory/pages-deploy-verified.json <<EOF
          {
            "status": "verified",
            "deployed_sha": "$GITHUB_SHA",
            "checked_at": "$checked_at",
            "page_url": "$PAGE_URL",
            "canonical_document_registry": "project-memory/documents-2026.json",
            "canonical_axioms_registry": "project-memory/publication-axioms.json",
            "build_entrypoint": "scripts/build-site.mjs",
            "homepage_bars_verified": true,
            "spider_title_verified": true,
            "dynamic_chronology_verified": true,
            "separate_active_originals_block_absent": true,
            "chronology_links_verified": true,
            "public_pdf_links_verified": true,
            "publication_axioms_verified": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-memory/pages-deploy-verified.json
          if git diff --cached --quiet; then
            echo "Verification record unchanged."
          else
            git commit -m "Record verified unified Pages deploy [skip ci]"
            git push
          fi
