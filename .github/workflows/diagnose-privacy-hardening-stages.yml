name: Diagnose residual privacy hardening failures

on:
  push:
    branches: [diag/privacy-residuals-20261121]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FALLBACK_CANDIDATE_SHA: 'dc6c712ea159bbfec0dc77ff51babb021591538f'

jobs:
  diagnose:
    name: Exact production fallback verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay exact fallback candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin fix/privacy-text-fallback-clean-20261121
          test "$(git rev-parse FETCH_HEAD)" = "$FALLBACK_CANDIDATE_SHA"
          git checkout FETCH_HEAD -- \
            scripts/publication_redaction.py \
            scripts/harden-public-pdf-privacy.py \
            scripts/public_text_fallback.py \
            test/publication_redaction_complexity.test.py \
            test/hardener_extracted_text_mode.test.py \
            test/public_text_fallback.test.py \
            test/hardener_text_fallback.test.py
          mkdir -p review-artifacts
          printf '{"fallback_candidate_sha":"%s"}\n' "$FALLBACK_CANDIDATE_SHA" > review-artifacts/fallback-candidate.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install fixed PDF tooling and verify exact candidate regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1
          node --check scripts/reconstruct-pre-hardening-tree.mjs
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          python3 -m py_compile scripts/public_text_fallback.py
          python3 -m py_compile scripts/verify-production-text-fallback-all.py
          python3 -m py_compile scripts/diagnose-extractor-divergence.py
          python3 test/publication_redaction_complexity.test.py
          python3 test/hardener_extracted_text_mode.test.py
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py

      - name: Provision authenticated private policy in runner temp
        shell: bash
        env:
          PRIVATE_POLICY_B64: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_B64 }}
          PRIVATE_POLICY_HMAC_KEY: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_POLICY_B64"
          test -n "$PRIVATE_POLICY_HMAC_KEY"
          POLICY_PATH="$RUNNER_TEMP/evidence-lab-private-redaction-policy.json"
          printf '%s' "$PRIVATE_POLICY_B64" | base64 --decode > "$POLICY_PATH"
          chmod 600 "$POLICY_PATH"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY=$POLICY_PATH" >> "$GITHUB_ENV"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY=$PRIVATE_POLICY_HMAC_KEY" >> "$GITHUB_ENV"

      - name: Reconstruct the exact pre-hardening public tree
        run: node scripts/reconstruct-pre-hardening-tree.mjs

      - name: Characterize extractor divergence without logging document text
        run: python3 scripts/diagnose-extractor-divergence.py

      - name: Verify exact production fallback on all seventeen residual PDFs
        run: python3 scripts/verify-production-text-fallback-all.py

      - name: Upload sanitized exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-text-fallback-all17-dc6c712
          path: |
            review-artifacts/production-text-fallback-all17.json
            review-artifacts/extractor-divergence-diagnostic.json
            review-artifacts/fallback-candidate.json
          if-no-files-found: error
          retention-days: 7