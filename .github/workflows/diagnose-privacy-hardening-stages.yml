name: Verify Justice Slalom hardened provenance on exact head

on:
  push:
    branches: [diag/privacy-residuals-20261121]

permissions:
  contents: read

env:
  TARGET_SHA: '8fad4de2b51c280825d857957dc98a426f32c37d'
  TARGET_DOCUMENT_ID: 'doc-cz-dd-2026-10-02-uoou-stiznost-necinnost'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Install fixed build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1

      - name: Provision authenticated private policy
        shell: bash
        env:
          PRIVATE_POLICY_B64: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_B64 }}
          PRIVATE_POLICY_HMAC_KEY: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_POLICY_B64"
          test -n "$PRIVATE_POLICY_HMAC_KEY"
          policy="$RUNNER_TEMP/evidence-lab-private-redaction-policy.json"
          printf '%s' "$PRIVATE_POLICY_B64" | base64 --decode > "$policy"
          chmod 600 "$policy"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY=$policy" >> "$GITHUB_ENV"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY=$PRIVATE_POLICY_HMAC_KEY" >> "$GITHUB_ENV"
          cp project-memory/documents-2026.json "$RUNNER_TEMP/canonical-documents-2026-prebuild.json"
          echo "EVIDENCE_LAB_CANONICAL_REGISTRY=$RUNNER_TEMP/canonical-documents-2026-prebuild.json" >> "$GITHUB_ENV"

      - name: Materialize exact trusted tree through Justice Slalom
        shell: bash
        run: |
          set -euo pipefail
          python3 test/publication_redaction.test.py
          node scripts/recover-historical-binary-blobs.mjs
          node scripts/materialize-godot-pdf-bundle.mjs
          node scripts/materialize-godot-state-bundle-2026-08-24.mjs
          python3 scripts/materialize-uoou-2026-08-26.py
          python3 scripts/materialize-euda-2026-09-25.py
          python3 scripts/materialize-state-pdfs-2026-09-03.py
          node scripts/prepare-md-english-build.mjs
          node scripts/build-site.mjs
          node scripts/cleanup-godot-duplicate-timers.mjs
          node scripts/patch-godot-reverse-reactions.mjs
          node scripts/finalize-public-labels.mjs
          node scripts/finalize-md-english-surfaces.mjs
          node scripts/build-justice-slalom.mjs
          node scripts/repair-chronology-deep-links.mjs
          node scripts/validate-chronology-deep-links.mjs
          node scripts/audit-godot-pdf-links.mjs
          node scripts/build-language-access.mjs
          node scripts/validate-release-exclusions.mjs
          node scripts/validate-public-navigation.mjs
          node scripts/validate-justice-slalom.mjs

      - name: Independently verify target provenance and public label
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-artifacts
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const candidateSha = process.env.TARGET_SHA;
          const targetId = process.env.TARGET_DOCUMENT_ID;
          const registry = JSON.parse(await readFile('project-memory/documents-2026.json', 'utf8'));
          const hardening = JSON.parse(await readFile('project-memory/privacy-hardening-report.json', 'utf8'));
          const slalom = JSON.parse(await readFile('web/data/justice-slalom.json', 'utf8'));
          const doc = registry.documents.find(item => item.id === targetId);
          const hardeningRow = hardening.documents.find(item => item.id === targetId);
          if (!doc || !hardeningRow) throw new Error('target provenance evidence missing');
          const bytes = await readFile(`web/${doc.public.pdf}`);
          const digest = createHash('sha256').update(bytes).digest('hex');
          const rows = slalom.rows.filter(row => row.document_id === targetId);
          const checks = {
            candidate_sha_matches: candidateSha === '8fad4de2b51c280825d857957dc98a426f32c37d',
            hardening_failures_zero: hardening.hard_failure_count === 0 && Array.isArray(hardening.hard_failures) && hardening.hard_failures.length === 0,
            hardening_changed: hardeningRow.changed === true,
            input_bound_to_declared_source: hardeningRow.input_sha256 === doc.justice_slalom.source_sha256,
            output_bound_to_public_pdf: hardeningRow.output_sha256 === digest && doc.public.sha256 === digest,
            registry_marks_policy_hardening: String(doc.public.verification_status || '').split(';').map(x => x.trim()).includes('publication_policy_hardened'),
            visible_hits_zero: Array.isArray(hardeningRow.known_private_identifier_hits_after) && hardeningRow.known_private_identifier_hits_after.length === 0,
            decoded_hits_zero: Array.isArray(hardeningRow.decoded_private_identifier_hits_after) && hardeningRow.decoded_private_identifier_hits_after.length === 0,
            rows_present: rows.length > 0,
            rows_label_public_copy: rows.every(row => row.pdf_kind === 'redacted_public_copy'),
            rows_hash_match: rows.every(row => row.pdf_sha256 === digest),
          };
          if (Object.values(checks).some(value => value !== true)) {
            throw new Error(`exact-head provenance verification failed: ${JSON.stringify(checks)}`);
          }
          const evidence = {
            schema_version: '1.0',
            candidate_sha: candidateSha,
            target_document_id: targetId,
            checks,
            document_text_logged: false,
            private_values_logged: false,
          };
          await writeFile('review-artifacts/justice-slalom-hardened-provenance.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify({ candidate_sha: candidateSha, target_document_id: targetId, status: 'verified' }));
          JS

      - name: Upload sanitized exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: justice-slalom-hardened-provenance-${{ env.TARGET_SHA }}
          path: review-artifacts/justice-slalom-hardened-provenance.json
          if-no-files-found: error
          retention-days: 7
