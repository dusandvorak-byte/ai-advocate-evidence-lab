name: Diagnose alternate bounded PDF transport on residual corpus

on:
  push:
    branches: [diag/privacy-residuals-20261121]

permissions:
  contents: read

env:
  TARGET_SHA: '3a804453b4f433d153f00a59300f012c8422a472'
  HARNESS_SHA: '745ef7899f65525770f67f59a9cede2a2adfb7f9'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install fixed PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1

      - name: Recover fixed trusted harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git show "$HARNESS_SHA:scripts/reconstruct-pre-hardening-tree.mjs" > scripts/reconstruct-pre-hardening-tree.mjs
          git show "$HARNESS_SHA:scripts/verify-production-text-fallback-all.py" > "$RUNNER_TEMP/all17.py"
          node --check scripts/reconstruct-pre-hardening-tree.mjs

      - name: Provision authenticated private policy
        shell: bash
        env:
          PRIVATE_POLICY_B64: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_B64 }}
          PRIVATE_POLICY_HMAC_KEY: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_POLICY_B64"
          test -n "$PRIVATE_POLICY_HMAC_KEY"
          policy="$RUNNER_TEMP/evidence-lab-private-redaction-policy.json"
          printf '%s' "$PRIVATE_POLICY_B64" | base64 --decode > "$policy"
          chmod 600 "$policy"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY=$policy" >> "$GITHUB_ENV"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY=$PRIVATE_POLICY_HMAC_KEY" >> "$GITHUB_ENV"

      - name: Reconstruct exact pre-hardening public tree without path logging
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconstruct-pre-hardening-tree.mjs > "$RUNNER_TEMP/reconstruct.log"
          echo 'pre-hardening tree reconstructed'

      - name: Test bounded mutool and Ghostscript transports on the remaining opaque failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import resource
          import runpy
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import fitz

          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          import public_text_fallback as fallback
          from publication_redaction import forbidden_public_identifiers, redact_public_text

          verifier = Path('/home/runner/work/_temp/all17.py')
          tree = ast.parse(verifier.read_text('utf-8'))
          targets = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'TARGETS' for t in node.targets):
                  targets = ast.literal_eval(node.value)
                  break
          if not isinstance(targets, list) or len(targets) != 17:
              raise SystemExit('unexpected trusted target inventory')

          source = root / 'web' / targets[13]
          hardener = runpy.run_path(str(root / 'scripts/harden-public-pdf-privacy.py'), run_name='alternate_transport_diagnostic')
          matchers = hardener['prepared_private_byte_matchers']()
          max_output = 128 * 1024 * 1024

          def limit_child():
              memory = 768 * 1024 * 1024
              resource.setrlimit(resource.RLIMIT_AS, (memory, memory))
              resource.setrlimit(resource.RLIMIT_FSIZE, (max_output, max_output))
              resource.setrlimit(resource.RLIMIT_CPU, (90, 90))

          def semantic_facts(path):
              doc = fitz.open(path)
              try:
                  identities = []
                  dimensions = []
                  for page in doc:
                      identities.append(
                          fallback.normalized_text_identity(
                              fallback.clean_text(page.get_text('text', sort=True))
                          )
                      )
                      dimensions.append((round(float(page.rect.width), 3), round(float(page.rect.height), 3)))
                  return identities, dimensions, doc.page_count
              finally:
                  doc.close()

          original_identities, original_dimensions, original_pages = semantic_facts(source)
          methods = [
              (
                  'mutool-clean',
                  lambda output: [
                      'mutool', 'clean', '-gggg', '-z', str(source), str(output)
                  ],
              ),
              (
                  'ghostscript-pdfwrite',
                  lambda output: [
                      'gs', '-q', '-dSAFER', '-dBATCH', '-dNOPAUSE',
                      '-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.7',
                      '-dAutoRotatePages=/None',
                      f'-sOutputFile={output}', str(source),
                  ],
              ),
          ]
          results = []

          for method, command in methods:
              row = {'method': method}
              with tempfile.TemporaryDirectory(prefix='alternate-pdf-transport-') as tmp:
                  tmpdir = Path(tmp)
                  normalized = tmpdir / 'normalized.pdf'
                  log = tmpdir / 'tool.log'
                  try:
                      with log.open('wb') as stream:
                          proc = subprocess.run(
                              command(normalized),
                              stdout=stream,
                              stderr=subprocess.STDOUT,
                              timeout=120,
                              check=False,
                              preexec_fn=limit_child,
                          )
                      row['returncode'] = proc.returncode
                  except subprocess.TimeoutExpired:
                      row['status'] = 'timeout'
                      results.append(row)
                      continue
                  except (OSError, ValueError) as exc:
                      row['status'] = 'launch_failure'
                      row['exception'] = type(exc).__name__
                      results.append(row)
                      continue

                  row['output_exists'] = normalized.is_file()
                  row['output_nonempty'] = row['output_exists'] and normalized.stat().st_size > 0
                  row['output_bounded'] = row['output_nonempty'] and normalized.stat().st_size <= max_output
                  if proc.returncode != 0 or not row['output_bounded']:
                      row['status'] = 'transport_failed'
                      results.append(row)
                      continue

                  try:
                      normalized_identities, normalized_dimensions, normalized_pages = semantic_facts(normalized)
                  except Exception as exc:
                      row['status'] = 'normalized_parse_failure'
                      row['exception'] = type(exc).__name__
                      results.append(row)
                      continue

                  row['semantic_match'] = bool(
                      normalized_pages == original_pages
                      and normalized_identities == original_identities
                      and normalized_dimensions == original_dimensions
                  )
                  if not row['semantic_match']:
                      row['status'] = 'semantic_mismatch'
                      results.append(row)
                      continue

                  try:
                      poppler_pages = fallback.extract_poppler_pages(normalized, original_pages)
                  except fallback.TextFallbackError:
                      row['status'] = 'poppler_failed_after_transport'
                      results.append(row)
                      continue
                  row['poppler_nonempty_all_pages'] = all(
                      fallback.normalized_text_identity(page)
                      for page in poppler_pages
                  )
                  if not row['poppler_nonempty_all_pages']:
                      row['status'] = 'one_sided_after_transport'
                      results.append(row)
                      continue

                  out = tmpdir / 'public.pdf'
                  try:
                      facts = fallback.build_public_text_copy(
                          normalized,
                          out,
                          redact_text=redact_public_text,
                          forbidden_text=forbidden_public_identifiers,
                      )
                      post = hardener['inspect_pdf_deep'](out, matchers)
                  except Exception as exc:
                      row['status'] = 'public_copy_failure'
                      row['exception'] = type(exc).__name__
                      results.append(row)
                      continue

                  row['post_clean'] = bool(
                      facts.get('deterministic')
                      and facts.get('source_page_count') == facts.get('output_page_count')
                      and facts.get('nonempty_page_count') == facts.get('source_page_count')
                      and not (post.get('reasons') or [])
                      and not (post.get('visible_private_hits') or [])
                      and not (post.get('decoded_private_hits') or [])
                      and post.get('text_scan_ok')
                      and post.get('decoded_scan_ok')
                      and post.get('pdf_revision_markers_bound')
                      and post.get('pdf_single_revision_only')
                  )
                  row['status'] = 'clean' if row['post_clean'] else 'post_failed'
                  results.append(row)

          summary = {
              'target_sha': '3a804453b4f433d153f00a59300f012c8422a472',
              'tested_methods': len(results),
              'clean_methods': [row['method'] for row in results if row.get('status') == 'clean'],
              'results': results,
              'document_paths_logged': False,
              'document_text_logged': False,
              'tool_diagnostics_logged': False,
              'secret_values_logged': False,
          }
          print(json.dumps(summary, ensure_ascii=False))
          if not summary['clean_methods']:
              raise SystemExit(1)
          PY
