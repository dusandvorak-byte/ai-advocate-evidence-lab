name: Verify exact-head fallback on all residual PDFs

on:
  push:
    branches: [diag/privacy-residuals-20261121]

permissions:
  contents: read

env:
  TARGET_SHA: '88b95115458b6b9b7f76532746408272bf469d7b'
  HARNESS_SHA: '745ef7899f65525770f67f59a9cede2a2adfb7f9'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install fixed PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1

      - name: Recover fixed trusted harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git show "$HARNESS_SHA:scripts/reconstruct-pre-hardening-tree.mjs" > scripts/reconstruct-pre-hardening-tree.mjs
          git show "$HARNESS_SHA:scripts/verify-production-text-fallback-all.py" > scripts/verify-production-text-fallback-all.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('scripts/verify-production-text-fallback-all.py')
          text = path.read_text('utf-8')
          old = 'CANDIDATE_SHA = "3161ab66ce6a1dae2eabad6ce584c650b51fa9a9"'
          new = f'CANDIDATE_SHA = "{os.environ["TARGET_SHA"]}"'
          if text.count(old) != 1:
              raise SystemExit('trusted harness candidate anchor mismatch')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
          node --check scripts/reconstruct-pre-hardening-tree.mjs
          python3 -m py_compile scripts/verify-production-text-fallback-all.py

      - name: Provision authenticated private policy
        shell: bash
        env:
          PRIVATE_POLICY_B64: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_B64 }}
          PRIVATE_POLICY_HMAC_KEY: ${{ secrets.EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_POLICY_B64"
          test -n "$PRIVATE_POLICY_HMAC_KEY"
          policy="$RUNNER_TEMP/evidence-lab-private-redaction-policy.json"
          printf '%s' "$PRIVATE_POLICY_B64" | base64 --decode > "$policy"
          chmod 600 "$policy"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY=$policy" >> "$GITHUB_ENV"
          echo "EVIDENCE_LAB_PRIVATE_REDACTION_POLICY_HMAC_KEY=$PRIVATE_POLICY_HMAC_KEY" >> "$GITHUB_ENV"

      - name: Reconstruct exact pre-hardening public tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconstruct-pre-hardening-tree.mjs > "$RUNNER_TEMP/reconstruct.log"
          echo 'pre-hardening tree reconstructed without document text logging'

      - name: Verify all 17 real residual PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-production-text-fallback-all.py

      - name: Independently validate sanitized evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('review-artifacts/production-text-fallback-all17.json')
          data = json.loads(path.read_text('utf-8'))
          summary = data.get('summary') or {}
          assert data.get('candidate_sha') == os.environ['TARGET_SHA']
          assert data.get('secret_values_logged') is False
          assert data.get('source_text_logged') is False
          assert data.get('error_messages_logged') is False
          assert summary == {
              'target_count': 17,
              'present_count': 17,
              'complete_count': 17,
              'clean_count': 17,
              'missing_count': 0,
              'error_count': 0,
          }
          for row in data.get('documents') or []:
              assert row.get('status') == 'complete'
              assert row.get('source_page_count') == row.get('output_page_count')
              assert row.get('nonempty_page_count') == row.get('source_page_count')
              assert not row.get('post_reasons')
              assert not row.get('visible_hit_ids')
              assert not row.get('decoded_hit_ids')
              assert row.get('text_scan_ok') is True
              assert row.get('decoded_scan_ok') is True
              assert row.get('pdf_revision_markers_bound') is True
              assert row.get('pdf_single_revision_only') is True
          print(json.dumps({'candidate_sha': data['candidate_sha'], 'summary': summary}))
          PY

      - name: Upload sanitized exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-fallback-all17-${{ env.TARGET_SHA }}
          path: review-artifacts/production-text-fallback-all17.json
          if-no-files-found: error
          retention-days: 7
