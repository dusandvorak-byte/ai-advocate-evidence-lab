name: Shard cost planner synthetic tests
on:
  pull_request:
    paths:
      - 'ops/shard-planning/**'
      - '.github/workflows/shard-cost-planning-tests.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python3 ops/shard-planning/test_cost_planner.py
