name: Vytvořit PDF kopie EUDA

on:
  push:
    branches:
      - agent/euda-07082026-011
    paths:
      - '.github/workflows/generate-euda-pdfs.yml'
      - 'scripts/generate-euda-pdfs.py'
      - 'web/documents/report-07082026-011/fulltext/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst větev
        uses: actions/checkout@v4
        with:
          ref: agent/euda-07082026-011
      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nainstalovat ReportLab
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Vytvořit PDF kopie
        run: python scripts/generate-euda-pdfs.py
      - name: Zapsat PDF do větve
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/documents/report-07082026-011/*.pdf
          if git diff --cached --quiet; then
            echo 'PDF jsou již aktuální.'
            exit 0
          fi
          git commit -m 'Vygenerovat veřejné PDF kopie podání EUDA [skip ci]'
          git push origin HEAD:agent/euda-07082026-011
