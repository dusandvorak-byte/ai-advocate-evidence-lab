name: Validate Evidence Lab design prototype (no deploy)
on:
  push:
    branches: ['feature/evidence-lab-jungle-jazz-ui-prototype']
    paths:
      - 'prototype/evidence-lab-jungle-ui/**'
      - '.github/workflows/validate-evidence-lab-ui-prototype.yml'
  pull_request:
    paths:
      - 'prototype/evidence-lab-jungle-ui/**'
      - '.github/workflows/validate-evidence-lab-ui-prototype.yml'
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static syntax and synthetic-only UI tests
        run: |
          node --check prototype/evidence-lab-jungle-ui/app.js
          node --test prototype/evidence-lab-jungle-ui/*.test.mjs
      - name: Confirm no public site files changed
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '^(web/|project-memory/|scripts/|\.github/workflows/publish-gh-pages-branch.yml)'; then
            echo 'Forbidden production/publishing path modified in design preview' >&2
            exit 1
          fi
