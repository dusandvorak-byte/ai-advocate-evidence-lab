name: Validate Evidence Admin Backend (synthetic only)

on:
  push:
    branches:
      - 'feature/evidence-admin-phase2-*'
    paths:
      - 'prototype/evidence-admin/backend/**'
      - '.github/workflows/validate-evidence-admin-backend.yml'
  pull_request:
    paths:
      - 'prototype/evidence-admin/backend/**'
      - '.github/workflows/validate-evidence-admin-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-admin-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-backend:
    name: Phase 2 synthetic API and approval policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check module syntax
        run: |
          node --check prototype/evidence-admin/backend/pdf-gate.mjs
          node --check prototype/evidence-admin/backend/review-workflow.mjs
          node --check prototype/evidence-admin/backend/local-demo-api.mjs
      - name: Run synthetic-only backend tests
        run: |
          node --test prototype/evidence-admin/backend/backend.test.mjs
          node --test prototype/evidence-admin/backend/local-demo-api.test.mjs
