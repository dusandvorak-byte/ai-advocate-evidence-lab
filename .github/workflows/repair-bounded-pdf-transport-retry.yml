      - name: Install mutool in all fallback execution workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/public-text-fallback.yml': [
                  ('sudo apt-get install -y -qq poppler-utils',
                   'sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf'),
              ],
              '.github/workflows/validate-evidence-lab-2.yml': [
                  ('sudo apt-get install -y -qq poppler-utils qpdf',
                   'sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf'),
              ],
              '.github/workflows/trusted-pdf-shard-diagnostic.yml': [
                  ('sudo apt-get install -y -qq poppler-utils qpdf',
                   'sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text('utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'missing dependency anchor in {name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, 'utf-8')
          PY
          git diff --check

      - name: Run focused and broad privacy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py
          python3 test/publication_redaction.test.py
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/public-text-fallback.yml \
            .github/workflows/trusted-pdf-shard-diagnostic.yml \
            .github/workflows/validate-evidence-lab-2.yml \
            scripts/public_text_fallback.py \
            test/public_text_fallback.test.py | sort)"
          test "$changed" = "$expected"

      - name: Commit verified bounded retry chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
