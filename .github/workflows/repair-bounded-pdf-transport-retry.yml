name: Repair bounded PDF transport retry

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Install fixed PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools poppler-utils qpdf
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pillow==13.0.0 pymupdf==2.1

      - name: Add bounded transport regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair-bounded-pdf-transport-retry.py tests
          python3 -m py_compile test/public_text_fallback.test.py
          git diff --check
          test "$(git diff --name-only)" = "test/public_text_fallback.test.py"

      - name: Prove new tests fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 test/public_text_fallback.test.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/red.log"
            echo 'bounded transport regressions unexpectedly passed before implementation' >&2
            exit 1
          fi
          grep -q 'test_qpdf_retry_recovers_generic_poppler_failure' "$RUNNER_TEMP/red.log"
          grep -Eq 'ERROR|FAIL' "$RUNNER_TEMP/red.log"

      - name: Implement fail-closed qpdf and mutool retry chain
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair-bounded-pdf-transport-retry.py implementation
          python3 -m py_compile scripts/public_text_fallback.py
          git checkout -- \
            .github/workflows/public-text-fallback.yml \
            .github/workflows/trusted-pdf-shard-diagnostic.yml \
            .github/workflows/validate-evidence-lab-2.yml
          git diff --check

      - name: Run focused and broad privacy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py
          python3 test/publication_redaction.test.py
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/public_text_fallback.py \
            test/public_text_fallback.test.py | sort)"
          test "$changed" = "$expected"

      - name: Commit verified bounded retry chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/public_text_fallback.py \
            test/public_text_fallback.test.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add bounded qpdf and mutool Poppler retry chain'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
