name: Shard transfer plan synthetic tests
on:
  pull_request:
    paths:
      - 'ops/shard-transfer/**'
      - '.github/workflows/shard-transfer-tests.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python3 ops/shard-transfer/test_transfer_plan.py
          python3 ops/shard-transfer/test_bundle.py
          python3 ops/shard-transfer/test_production_transport.py
          python3 -m py_compile scripts/audit-release-evidence-sliced.py ops/shard-transfer/production_transport.py
