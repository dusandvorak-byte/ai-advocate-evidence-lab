name: Opravit kanonický SHA archivu Godot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-heal-godot-archive-sha
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sjednotit očekávaný SHA-256 s ověřeným archivem
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/materialize-godot-pdf-bundle.mjs')
          text = p.read_text(encoding='utf-8')
          old = '1a89a63a993d13628dd113db37b2c27097817bce15c1e6fbc30aa5038e137200'
          new = '14f9bcc938403ed4b615a5a5879ec8e40b4bc7b6691114b0e6e035cdb91e6e31'
          if old in text:
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Materializátor neobsahuje očekávaný starý ani nový SHA-256 archivu.')
          PY
          if git diff --quiet -- scripts/materialize-godot-pdf-bundle.mjs; then
            echo 'SHA-256 archivu je již kanonický.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize-godot-pdf-bundle.mjs
          git commit -m 'Opravit kanonický SHA-256 archivu PDF 25–33'
          git push origin HEAD:main
