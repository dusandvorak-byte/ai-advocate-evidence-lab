name: Verify deterministic public text fallback

on:
  push:
    branches: [fix/privacy-text-fallback-20261121]
  pull_request:
    branches: [main, fix/linear-pdf-byte-scanner-20261121]

permissions:
  contents: read

jobs:
  fallback:
    name: Public text fallback regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Install fixed PDF dependencies
        run: python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pymupdf==2.1
      - name: Run fallback regressions
        run: python3 test/public_text_fallback.test.py
