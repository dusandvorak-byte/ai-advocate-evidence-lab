name: Pull request safety gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Evidence, publication and source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run all regression tests
        run: node --test test/*.test.mjs
      - name: Verify immutable publication manifest
        run: node tools/build-publication-manifest.mjs --check
      - name: Verify local public sources
        run: node tools/check-public-sources.mjs
