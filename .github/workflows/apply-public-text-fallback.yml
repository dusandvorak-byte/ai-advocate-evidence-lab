name: Apply verified public text fallback integration

on:
  push:
    branches: [fix/privacy-text-fallback-20261121]
    paths:
      - .github/workflows/apply-public-text-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    name: Integrate fail-closed text fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-text-fallback-20261121
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Apply exact reviewed integration
        run: python3 scripts/apply-public-text-fallback-patch.py

      - name: Verify exact integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check reportlab==5.1.0 pymupdf==2.1
          python3 -m py_compile scripts/public_text_fallback.py
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          python3 test/public_text_fallback.test.py
          python3 test/hardener_text_fallback.test.py
          git diff --check

      - name: Commit bounded integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py
          git diff --cached --check
          git commit -m 'Apply deterministic text fallback after unsafe PDF post-scan'
          git push origin HEAD:fix/privacy-text-fallback-20261121

# one-shot trigger revision 3
