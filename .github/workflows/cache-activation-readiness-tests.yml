name: Transform cache readiness synthetic tests
on:
  pull_request:
    paths:
      - 'ops/cache-activation-readiness/**'
      - '.github/workflows/cache-activation-readiness-tests.yml'
      - '.github/workflows/trusted-pdf-shard-diagnostic.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python3 ops/cache-activation-readiness/test_readiness.py
          python3 ops/cache-activation-readiness/test_pilot_gate.py
