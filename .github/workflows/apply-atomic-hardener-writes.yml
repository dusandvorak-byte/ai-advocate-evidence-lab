name: Apply atomic hardener writes

on:
  push:
    branches: [fix/privacy-text-fallback-clean-20261121]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/harden-public-pdf-privacy.py')
          text = path.read_text('utf-8')

          old_import = 'from public_text_fallback import build_public_text_copy'
          new_import = 'from public_text_fallback import atomic_replace_bytes, build_public_text_copy'
          if text.count(old_import) != 1:
              raise SystemExit('unexpected public_text_fallback import count')
          text = text.replace(old_import, new_import)

          data_write = 'path.write_bytes(data)'
          rollback_write = 'path.write_bytes(original_bytes)'
          data_count = text.count(data_write)
          rollback_count = text.count(rollback_write)
          print({'data_write_count': data_count, 'rollback_write_count': rollback_count})
          if data_count < 1:
              raise SystemExit('ordinary hardening write was not found')
          if rollback_count < 1:
              raise SystemExit('rollback writes were not found')

          text = text.replace(data_write, 'atomic_replace_bytes(path, data)')
          text = text.replace(rollback_write, 'atomic_replace_bytes(path, original_bytes)')
          if 'path.write_bytes(' in text:
              raise SystemExit('a direct transaction write remains after patch')

          path.write_text(text, 'utf-8')
          PY
          python3 -m py_compile scripts/harden-public-pdf-privacy.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/harden-public-pdf-privacy.py"
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harden-public-pdf-privacy.py
          git commit -m 'Use atomic writes throughout PDF hardening transaction'
          git push origin HEAD:fix/privacy-text-fallback-clean-20261121
